<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>学習帖 — 英語 / Power On English Communication I</title>

<!-- PWA: manifest & theme -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF7F0">
<meta name="color-scheme" content="light">

<!-- iOS specific -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学習帖・英語">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   学習帖 — 英語  |  Design system
   ============================================================ */
:root{
  --paper:#FAF7F0;
  --paper-edge:#EFE9D9;
  --ink:#2C2C2C;
  --ink-soft:#5C5854;
  --rule:#D9D3C2;          /* notebook rule line */
  --rule-soft:#EDE6D2;
  --accent:#E8743C;        /* Power On orange */
  --accent-deep:#C45A26;
  --indigo:#1F4068;        /* tab indigo */
  --indigo-soft:#3A5A85;
  --good:#3C8A5A;
  --bad:#C4523A;
  --shadow:0 4px 20px rgba(60,40,20,.08);
  --shadow-deep:0 12px 40px rgba(60,40,20,.15);
  --tab-1:#E8743C; --tab-2:#3A8A8A; --tab-3:#7A4E9A;
  --tab-4:#C44A6A; --tab-5:#5A9A3C; --tab-6:#3C6AC4;
  --tab-7:#2C8A7A; --tab-8:#C49A2C; --tab-9:#9A4C3C;
  --tab-10:#5C5854;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans JP','Inter',sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #F5EFDD 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, #F0E8D2 0%, transparent 50%),
    var(--paper);
  color:var(--ink);
  line-height:1.7;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  /* iOS standalone safe area */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  overscroll-behavior-y:contain;
}
/* Prevent iOS zoom on focus by ensuring input font-size >= 16px */
input,textarea,select{font-size:16px}
button{-webkit-appearance:none;cursor:pointer;font-family:inherit}

/* ============================================================
   Page frame: ノートのインデックスタブ感
   ============================================================ */
.app{
  max-width:980px;
  margin:0 auto;
  padding:24px 16px 80px;
}

header.brand{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:8px;
  gap:12px;
}
header.brand h1{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:.04em;
}
header.brand h1 .sep{
  color:var(--accent);
  margin:0 .35em;
}
header.brand .right{
  text-align:right;
}
header.brand .nav-btns{
  display:flex;
  gap:6px;
  justify-content:flex-end;
  margin-bottom:4px;
  flex-wrap:wrap;
}
header.brand .nav-btn{
  appearance:none;
  background:#FFFDF7;
  border:1.5px solid var(--rule);
  color:var(--ink);
  font-family:'Noto Sans JP',sans-serif;
  font-size:12px;
  font-weight:600;
  padding:6px 12px;
  border-radius:99px;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:4px;
  transition:all .12s;
}
header.brand .nav-btn:hover{
  border-color:var(--accent);
  color:var(--accent-deep);
  background:#FFF7EF;
}
header.brand .nav-btn.pause{
  border-color:var(--accent);
  color:var(--accent-deep);
}
header.brand .nav-btn.pause:hover{
  background:var(--accent);
  color:#FFFDF7;
}
header.brand .sub{
  font-family:'Crimson Pro',serif;
  font-size:14px;
  color:var(--ink-soft);
  font-style:italic;
  text-align:right;
}

/* ============================================================
   Lesson tab strip (left index tabs like a notebook)
   ============================================================ */
.tab-strip{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin:18px 0 0;
  padding-bottom:0;
}
.tab-strip button.lesson-tab{
  appearance:none;
  border:none;
  background:#EAE2CE;
  color:var(--ink-soft);
  font-family:'Inter','Noto Sans JP',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:10px 14px 12px;
  border-radius:10px 10px 0 0;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:transform .15s ease, background .15s;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  min-width:96px;
}
.tab-strip button.lesson-tab .ttl{
  font-size:11px;
  color:var(--ink-soft);
  font-weight:500;
  font-family:'Noto Sans JP',sans-serif;
}
.tab-strip button.lesson-tab .num{font-size:13px;color:var(--ink)}
.tab-strip button.lesson-tab:hover{background:#F0E8D2;transform:translateY(-2px)}
.tab-strip button.lesson-tab.active{
  background:var(--paper);
  color:var(--ink);
  border-bottom:3px solid var(--paper);
  box-shadow:0 -4px 12px rgba(60,40,20,.08);
  transform:translateY(0);
}
.tab-strip button.lesson-tab.active::after{
  content:"";
  position:absolute;
  left:0;right:0;top:0;
  height:4px;
  border-radius:10px 10px 0 0;
  background:var(--tab-color, var(--accent));
}

/* notebook sheet */
.sheet{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:0 12px 12px 12px;
  padding:32px 32px 40px;
  box-shadow:var(--shadow);
  position:relative;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      var(--rule-soft) 31px,
      var(--rule-soft) 32px
    );
}
.sheet::before{
  content:"";
  position:absolute;
  left:54px;top:0;bottom:0;
  width:1px;
  background:rgba(232,116,60,.25);
}

/* Lesson header */
.lesson-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding-bottom:18px;
  margin-bottom:18px;
  border-bottom:1px dashed var(--rule);
}
.lesson-head .titles h2{
  font-family:'Crimson Pro',serif;
  font-size:30px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:.01em;
  line-height:1.2;
}
.lesson-head .titles h2 .lesson-num{
  display:inline-block;
  background:var(--tab-color, var(--accent));
  color:#fff;
  padding:2px 12px;
  border-radius:6px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  letter-spacing:.08em;
  margin-right:10px;
  vertical-align:middle;
  transform:translateY(-3px);
}
.lesson-head .titles .theme{
  font-size:13px;
  color:var(--ink-soft);
  margin-top:4px;
}
.lesson-head .titles .theme b{color:var(--accent-deep);font-weight:600}
.lesson-head .progress-card{
  background:#FFF;
  border:1px solid var(--rule);
  border-radius:10px;
  padding:10px 14px;
  min-width:170px;
  text-align:right;
}
.lesson-head .progress-card .label{font-size:11px;color:var(--ink-soft);letter-spacing:.05em}
.lesson-head .progress-card .pct{
  font-family:'Crimson Pro',serif;
  font-size:24px;
  font-weight:600;
  color:var(--indigo);
}
.lesson-head .progress-card .bar{
  height:6px;background:#EFE9D9;border-radius:99px;overflow:hidden;margin-top:6px;
}
.lesson-head .progress-card .bar > i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--tab-color,var(--accent)),var(--accent-deep));
  border-radius:99px;
  transition:width .5s ease;
}

/* Mode picker */
.mode-row{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:0 0 18px;
  border-bottom:1px solid var(--rule);
  margin-bottom:22px;
}
.mode-row button{
  appearance:none;
  border:1.5px solid var(--rule);
  background:#FFFDF7;
  color:var(--ink);
  font-family:'Noto Sans JP',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:8px 14px;
  border-radius:99px;
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;align-items:center;gap:6px;
}
.mode-row button .glyph{font-size:14px}
.mode-row button:hover{border-color:var(--accent);color:var(--accent-deep);background:#FFF7EF}
.mode-row button.active{
  background:var(--ink);color:#FFFDF7;border-color:var(--ink);
}

/* ============================================================
   Question card
   ============================================================ */
.qarea{padding:6px 4px}
.qmeta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--ink-soft);
  margin-bottom:10px;
}
.qmeta .step{font-family:'Crimson Pro',serif;font-size:14px}
.qmeta .score{font-weight:600}
.qmeta .score b.good{color:var(--good)}
.qmeta .score b.bad{color:var(--bad)}

.q-card{
  background:#FFFDF7;
  border:1px solid var(--rule);
  border-radius:14px;
  padding:24px 26px;
  margin-bottom:18px;
  position:relative;
  box-shadow:0 2px 6px rgba(60,40,20,.04);
}
.q-card .qno{
  position:absolute;left:-10px;top:18px;
  background:var(--tab-color,var(--accent));
  color:#fff;
  font-family:'Crimson Pro',serif;font-weight:600;
  padding:2px 10px;border-radius:4px;font-size:13px;
}
.q-card .qprompt{
  font-size:13px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.04em;
}
.q-card .qbody{
  font-family:'Crimson Pro',serif;
  font-size:20px;
  line-height:1.7;
  margin:6px 0 18px;
  color:var(--ink);
}
.q-card .qbody .blank{
  display:inline-block;min-width:80px;text-align:center;
  border-bottom:2px solid var(--accent);
  font-weight:600;color:transparent;
}
.q-card .qbody.ja{font-family:'Noto Sans JP',sans-serif;font-size:18px}
.q-card .reading-passage{
  font-family:'Crimson Pro',serif;
  font-size:17px;line-height:1.85;
  color:var(--ink);
  background:#FFF9EC;
  border-left:3px solid var(--accent);
  padding:18px 22px;
  border-radius:0 8px 8px 0;
  margin-bottom:18px;
  max-height:none;
}
.q-card .reading-passage h4{
  font-size:14px;font-family:'Inter',sans-serif;color:var(--accent-deep);
  margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase;
}

/* choices */
.choices{display:flex;flex-direction:column;gap:8px}
.choices button.choice{
  appearance:none;
  text-align:left;
  background:#FFF;
  border:1.5px solid var(--rule);
  padding:12px 16px;
  border-radius:10px;
  font-family:'Crimson Pro',serif;
  font-size:17px;
  cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;
  transition:all .15s;
  color:var(--ink);
}
.choices button.choice .mark{
  display:inline-block;
  width:24px;height:24px;
  border-radius:50%;
  background:#EFE9D9;
  color:var(--ink-soft);
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.choices button.choice:hover:not(.locked){
  border-color:var(--accent);
  background:#FFF7EF;
}
.choices button.choice.selected{border-color:var(--indigo)}
.choices button.choice.correct{
  background:#EAF6EE;border-color:var(--good);color:#1F5C32;
}
.choices button.choice.correct .mark{background:var(--good);color:#fff}
.choices button.choice.wrong{
  background:#FBEBE6;border-color:var(--bad);color:#7A2A1A;
}
.choices button.choice.wrong .mark{background:var(--bad);color:#fff}
.choices button.choice.locked{cursor:default}

/* Free text input (writing / translate) */
textarea.answer-input{
  width:100%;
  min-height:88px;
  background:#FFFDF7;
  border:1.5px solid var(--rule);
  border-radius:10px;
  padding:14px 16px;
  font-family:'Crimson Pro',serif;
  font-size:17px;
  color:var(--ink);
  resize:vertical;
  line-height:1.6;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 27px,
    var(--rule-soft) 27px, var(--rule-soft) 28px);
}
textarea.answer-input.ja{
  font-family:'Noto Sans JP','Zen Maru Gothic',sans-serif;
  font-size:16px;
}
textarea.answer-input:focus{outline:none;border-color:var(--accent);background-color:#FFF}

/* Single-line verb form fill */
.text-fill-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:8px;
}
.text-fill-row label{
  font-size:13px;color:var(--ink-soft);
}
input.text-fill{
  flex:1;min-width:160px;
  border:none;
  border-bottom:2px solid var(--accent);
  background:#FFFDF7;
  font-family:'Crimson Pro',serif;
  font-size:18px;
  font-weight:600;
  color:var(--ink);
  padding:8px 4px;
  font-style:italic;
}
input.text-fill:focus{outline:none;background:#FFF7EF}

/* Arrange (並べ替え) chip area */
.arrange-area{margin-top:6px}
.arrange-answer{
  min-height:64px;
  border:1.5px dashed var(--rule);
  border-radius:10px;
  padding:14px 12px;
  background:#FFFDF7;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:14px;
  align-items:flex-start;
}
.arrange-answer .placeholder{
  color:var(--ink-soft);font-size:13px;font-style:italic;
  display:flex;align-items:center;height:32px;
}
.arrange-pool{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:8px 0;
  border-top:1px dashed var(--rule);
}
.arrange-pool::before{
  content:"語の引き出し";
  display:block;width:100%;font-size:11px;color:var(--ink-soft);
  margin-bottom:6px;letter-spacing:.05em;
}
.word-chip{
  background:#FFF;
  border:1.5px solid var(--rule);
  padding:6px 14px;
  border-radius:99px;
  font-family:'Crimson Pro',serif;
  font-size:17px;
  cursor:pointer;
  transition:all .12s;
  color:var(--ink);
}
.word-chip:hover:not(:disabled){
  border-color:var(--accent);
  background:#FFF7EF;
}
.arrange-answer .word-chip{
  background:var(--ink);
  color:#FFFDF7;
  border-color:var(--ink);
}
.arrange-answer .word-chip:hover{
  background:#000;border-color:#000;
}
.word-chip:disabled{opacity:.4;cursor:not-allowed}

/* Action buttons */
.q-actions{
  display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center;
}
.btn{
  appearance:none;border:none;cursor:pointer;
  padding:10px 22px;border-radius:99px;
  font-family:'Noto Sans JP',sans-serif;font-weight:600;font-size:14px;
  transition:transform .12s, background .12s;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:#FFFDF7}
.btn.primary:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-deep)}

/* Feedback panel (shown after answer) */
.feedback{
  margin-top:14px;padding:14px 18px;
  border-radius:10px;
  font-size:14px;line-height:1.7;
  display:none;
  animation:popIn .25s ease;
}
.feedback.show{display:block}
.feedback.good{background:#EAF6EE;border-left:3px solid var(--good);color:#1F5C32}
.feedback.bad{background:#FBEBE6;border-left:3px solid var(--bad);color:#7A2A1A}
.feedback .stamp{
  display:inline-block;font-weight:700;letter-spacing:.1em;
  margin-right:8px;font-family:'Crimson Pro',serif;font-size:16px;
}
.feedback .ja-hint{
  display:block;margin-top:6px;color:var(--ink-soft);font-size:13px;
}
.feedback .ans-line{
  display:block;margin-top:6px;color:var(--ink);font-size:14px;
}
.feedback .ans-line b{color:var(--good)}

@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

/* Summary screen */
.summary{
  background:#FFFDF7;
  border:1px solid var(--rule);
  border-radius:14px;
  padding:30px;
  text-align:center;
}
.summary h3{
  font-family:'Crimson Pro',serif;font-size:24px;margin-bottom:8px;color:var(--ink);
}
.summary .score-big{
  font-family:'Crimson Pro',serif;font-size:64px;font-weight:600;
  color:var(--accent);line-height:1;margin:10px 0;
}
.summary .score-big small{font-size:24px;color:var(--ink-soft)}
.summary .stamp-circle{
  display:inline-block;border:3px double var(--accent);border-radius:50%;
  padding:14px 22px;color:var(--accent-deep);
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
  transform:rotate(-8deg);margin:14px 0;
  font-size:18px;letter-spacing:.1em;
}
.summary .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* Placeholder for未実装lessons */
.placeholder{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
}
.placeholder .glyph{font-size:48px;display:block;margin-bottom:12px;opacity:.5}
.placeholder h3{font-family:'Crimson Pro',serif;font-size:22px;margin-bottom:6px;color:var(--ink)}
.placeholder p{font-size:14px}
.placeholder .badge{
  display:inline-block;margin-top:18px;
  background:#EFE9D9;color:var(--ink-soft);
  padding:6px 14px;border-radius:99px;font-size:12px;
}

/* Review bank (復習帳) drawer button */
.review-fab{
  position:fixed;
  right:20px;bottom:20px;
  background:var(--indigo);color:#fff;
  border:none;border-radius:99px;
  padding:12px 18px;
  font-family:'Noto Sans JP',sans-serif;font-weight:600;font-size:13px;
  cursor:pointer;
  box-shadow:var(--shadow-deep);
  display:inline-flex;align-items:center;gap:6px;
  z-index:50;
}
.review-fab .count{
  background:var(--accent);padding:2px 8px;border-radius:99px;font-size:11px;
}
.review-fab:hover{background:var(--indigo-soft)}

.modal-bg{
  position:fixed;inset:0;background:rgba(20,15,5,.45);
  display:none;align-items:flex-start;justify-content:center;
  z-index:100;padding:40px 16px;overflow-y:auto;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--paper);border-radius:14px;
  width:100%;max-width:680px;padding:24px 26px;
  box-shadow:var(--shadow-deep);
}
.modal h3{
  font-family:'Crimson Pro',serif;font-size:22px;margin-bottom:6px;
}
.modal .close{
  float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);
}
.modal .item{
  border-top:1px dashed var(--rule);padding:14px 0;
}
.modal .item:first-of-type{border-top:none}
.modal .item .q{font-family:'Crimson Pro',serif;font-size:16px;color:var(--ink)}
.modal .item .a{font-size:13px;color:var(--ink-soft);margin-top:4px}
.modal .item .a b{color:var(--good)}
.modal .item .tags{font-size:11px;color:var(--ink-soft);margin-top:4px}

/* Explanation modal content (rich) */
.explain-body{font-size:14px;line-height:1.85;color:var(--ink)}
.explain-body h4{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-size:14px;color:var(--accent-deep);
  margin:14px 0 6px;letter-spacing:.05em;
  border-left:3px solid var(--accent);padding-left:8px;
}
.explain-body h4:first-child{margin-top:0}
.explain-body p{margin:6px 0}
.explain-body ul{margin:6px 0 6px 22px;padding:0}
.explain-body ul li{margin:3px 0;font-size:14px}
.explain-body b{color:var(--ink);font-weight:600}
.explain-body code{
  background:#F5EFDD;color:var(--accent-deep);
  padding:1px 5px;border-radius:4px;
  font-family:'Crimson Pro',serif;font-size:14px;
  border:1px solid var(--rule);
}
.explain-body em{
  font-style:italic;color:var(--ink-soft);
  font-family:'Crimson Pro',serif;
}
.explain-q-recap{
  background:#FFF9EC;

const QUESTIONS = {

  /* ====================  LESSON 1  ====================
     試験範囲: Part 1〜3 (p.14-21)
     語彙: 配付資料の単語リスト準拠 (nowadays/seek/mecca/not only…but also/that is/
            stand for/from all around the world/be popular with ほか + 本文要語)
     文法: 助動詞 can/will/may/must/should + 現在形/過去形/現在進行形/過去進行形
  */
  1: {
    vocab:[
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"nowadays", choices:["昔は","近頃は","いつでも","二度と"], answer:1, note:"副詞「近頃は・このごろは」。",
       explain:"## 意味\n**nowadays** = 副詞で「近頃は／このごろは」。\n\n## ポイント\n- 現在の傾向や習慣を述べるときに使う\n- 文頭・文中・文末どこにも置ける\n\n## 例文\n- `Nowadays, many people work from home.`（近頃は多くの人が在宅勤務をしている）\n- `Cash is rarely used nowadays.`（現金は近頃あまり使われない）\n\n## 似た語\n**these days** とほぼ同じ意味。nowadays の方が「以前と比べて変化した」のニュアンスがやや強い。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"seek", choices:["売る","探す・探究する","眠る","縫う"], answer:1, note:"seek - sought - sought と不規則変化。",
       explain:"## 意味\n**seek** = 「探す／探究する／求める」を意味する動詞。\n\n## 活用\n`seek – sought – sought`（不規則動詞）\n\n## 例文\n- `Tourists are seeking new experiences.`（旅行者は新しい体験を探している）\n- `He sought advice from his teacher.`（彼は先生に助言を求めた）\n\n## look for との違い\n**seek** は固い語で、抽象的な対象（真理・知恵・体験など）にも使える。**look for** は口語的でモノを探す時によく使う。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"mecca", choices:["麦","メッカ・聖地","機械","メダル"], answer:1, note:"「(ある分野で) 多くの人が集まる聖地」。",
       explain:"## 意味\n**mecca** = 「メッカ／聖地」。本来はイスラム教の聖地メッカ（サウジアラビア）を指すが、転じて「ある分野で人々が憧れて集まる場所」の意味で使う。\n\n## 例文\n- `Niseko is a mecca for skiers.`（ニセコはスキーヤーの聖地だ）\n- `Akihabara is a mecca for anime fans.`（秋葉原はアニメファンの聖地だ）\n\n## ポイント\nふつう `a mecca for ~` の形で使う。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"skier", choices:["スキーヤー","スリッパ","水夫","空港"], answer:0,
       explain:"## 意味\n**skier** = スキーをする人（スキーヤー）。\n\n## 作り方\n`ski`（スキーをする）+ `-er`（する人）= `skier`\n\n## 似た形\n- `snowboarder` = スノーボードをする人\n- `surfer` = サーフィンをする人\n- `runner` = 走る人\n\n## 注意\n発音は「スキーヤー」ではなく `/ˈskiːər/`（スキーア）に近い。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"snowboarder", choices:["雪かき係","スノーボーダー","気象予報士","雪だるま"], answer:1,
       explain:"## 意味\n**snowboarder** = スノーボードをする人。\n\n## 作り方\n`snow`（雪）+ `board`（板）+ `-er`（する人）。\n\n## 例文\n- `Skiers and snowboarders come from all around the world.`（スキーヤーやスノーボーダーが世界中からやって来る）\n\n## ポイント\nスポーツツーリズム関連の文では skier と snowboarder がセットで出ることが多い。"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"not only A but also B", choices:["AかBのどちらか","AでもBでもない","Aだけでなく B も","Aの代わりに B"], answer:2, note:"「A だけでなく B も」。",
       explain:"## 意味\n**not only A but also B** =「A だけでなく B も」\n\n## ポイント\n- A と B には文法的に**同じ種類**のものを置く（名詞↔名詞、動詞↔動詞）\n- `also` は省略されることもある（口語）\n\n## 例文\n- `Not only sightseeing but also cultural experiences are popular.`（観光だけでなく文化体験も人気だ）\n- `She speaks not only English but also French.`（彼女は英語だけでなくフランス語も話す）\n\n## 主語が not only A but also B の時\n動詞は **B に一致** させる。上の文では `cultural experiences` が複数なので `are`。"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"that is", choices:["それは","つまり","あれだ","それでも"], answer:1, note:"言いかえ・補足。",
       explain:"## 意味\n**that is** =「つまり／すなわち」。直前の内容を言いかえる時に使う表現。\n\n## 例文\n- `Tourists are seeking fresh experiences, that is, not just sightseeing.`（旅行者は新鮮な体験を求めている。つまり、ただの観光ではない）\n\n## ポイント\n- 前後にカンマ `,` を置くのがふつう（`, that is,`）\n- ラテン語由来の **i.e.** と同じ意味（書き言葉では i.e. を使う）\n\n## 注意\n単なる指示語の「あれは〜だ」（that is + 名詞）と区別する。"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"stand for ...", choices:["…を表す","…に立ち向かう","…の前に立つ","…を支える"], answer:0, note:"略語の説明でよく使う。",
       explain:"## 意味\n**stand for ~** =「〜を表す／〜の略である」。\n\n## 例文\n- `\"Japow\" stands for \"Japanese powder snow.\"`（「ジャパウ」は「日本の粉雪」を表す）\n- `UN stands for the United Nations.`（UN は国際連合の略）\n\n## ポイント\n- **略語・記号の意味**を説明する時に超頻出\n- 似た表現: `~ means ...`\n\n## 別の意味\n「〜に賛成する／支持する」の意味もある: `I stand for equality.`（私は平等を支持する）"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"from all around the world", choices:["近所から","全世界に向けて","世界中から","半周して"], answer:2,
       explain:"## 意味\n**from all around the world** =「世界中から」。\n\n## 構成\n`from`（〜から）+ `all around the world`（世界中の至るところ）\n\n## 例文\n- `Skiers come from all around the world.`（スキーヤーは世界中からやってくる）\n- `Tourists visit Japan from all around the world.`（観光客が世界中から日本を訪れる）\n\n## 言い換え\n- `from all over the world`（同じ意味）\n- `from around the globe`（やや書き言葉）"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"come and experience ...", choices:["…にやって来ない","…を体験しにくる","…を経験せずに帰る","…を遠くから見る"], answer:1,
       explain:"## 意味\n**come and experience ~** =「〜を体験しに来る／〜を体験するためにやって来る」。\n\n## 構造\n`come`（来る）+ `and`（そして）+ `experience`（体験する）\n\n## 例文\n- `Skiers come and experience Japow in Niseko.`（スキーヤーはジャパウを体験しにニセコへ来る）\n\n## ポイント\n口語英語では `come and ~` は「〜しに来る」を意味する慣用表現。`come to ~` でも置き換え可能（come to experience）。"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"be popular with ...", choices:["…と一緒にいる","…に人気がある","…に嫌われる","…で混雑する"], answer:1,
       explain:"## 意味\n**be popular with ~** =「〜に人気がある」。\n\n## 注意：前置詞\n- `popular **with** + 人` … 人気の対象が人\n- `popular **for** + 物事` … 〜のことで人気がある\n- `popular **as** + 役割` … 〜として人気\n\n## 例文\n- `Niseko is popular with foreign skiers.`（ニセコは外国人スキーヤーに人気がある）\n- `The shrine is famous **for** its red gates.`（神社は赤い鳥居で有名）\n\n## ポイント\n**with** = 「（人）にとって」のニュアンス。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"countless", choices:["数えられる","ほぼゼロの","数え切れないほどの","限定された"], answer:2, note:"count + less = 数えられない。",
       explain:"## 意味\n**countless** =「数え切れないほどの／非常に多い」。\n\n## 語の構成\n`count`（数える）+ `-less`（〜できない）= 数えられない\n\n## 似た形の語\n- `endless` = 終わりのない\n- `useless` = 役に立たない\n- `careless` = 不注意な\n\n## 例文\n- `The shrine has countless red torii gates.`（その神社には数え切れないほどの赤い鳥居がある）\n- `She has countless friends.`（彼女には数え切れないほどの友人がいる）\n\n## 注意\n後ろは**複数名詞**になる（countless gate**s**）。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"contrast", choices:["契約","対比・コントラスト","対立心","集中"], answer:1,
       explain:"## 意味\n**contrast** =「対比・コントラスト」（名詞）／「対比する」（動詞）。\n\n## 例文\n- `The sharp contrast between the red gates and the black letters is exotic.`（赤い鳥居と黒い文字の鮮やかな対比は異国風だ）\n- `In contrast to summer, winter here is dry.`（夏とは対照的に、ここの冬は乾燥している）\n\n## よく使うコロケーション\n- `a sharp / striking contrast` = はっきりした対比\n- `in contrast (to / with)` = 〜とは対照的に\n- `make a contrast` = 対比をなす"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"exotic", choices:["異国風の","退屈な","平凡な","電子的な"], answer:0,
       explain:"## 意味\n**exotic** =「異国風の／珍しい／エキゾチックな」。\n\n## 例文\n- `The shrine looks exotic to foreign tourists.`（その神社は外国人観光客には異国風に見える）\n- `She loves exotic food.`（彼女は珍しい外国料理が好きだ）\n\n## ポイント\n「自分の文化と違って珍しい・魅力的」というポジティブなニュアンス。\n\n## 注意\n発音は `/ɪɡˈzɒtɪk/`（イグゾティック）でアクセントは中央。`exit`（出口）とは全くの別語。"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"appeal to ...", choices:["…をあわれむ","…の心を引きつける","…に謝罪する","…に申請する"], answer:1,
       explain:"## 意味\n**appeal to ~** =「〜の心を引きつける／〜に訴える」。\n\n## 例文\n- `The exotic shrine appeals to visitors from abroad.`（その異国風の神社は海外からの旅行者の心を引きつける）\n- `This book appeals to young readers.`（この本は若い読者の心をつかむ）\n\n## 別の意味\n- 「（人）に訴える／お願いする」: `He appealed to the judge.`（彼は裁判官に訴えた）\n- 「（法律）控訴する」\n\n## 名詞形\n`appeal` = 魅力／訴え"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"construction", choices:["相談","建設・建立","結論","集中"], answer:1,
       explain:"## 意味\n**construction** =「建設／建立／工事」。\n\n## 語の構成\n動詞 `construct`（建設する）の名詞形。\n\n## 例文\n- `The construction of the bridge took 5 years.`（その橋の建設には 5 年かかった）\n- `The gates show their construction dates.`（鳥居にはその建立年月日が書かれている）\n\n## 関連語\n- `construct` 動詞 = 建設する\n- `under construction` = 工事中\n- `instruction` = 指示（似ているが別語）"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"donor", choices:["寄贈者","収集家","購入者","観光客"], answer:0,
       explain:"## 意味\n**donor** =「寄贈者／提供者／献血者」。\n\n## 語の構成\n動詞 `donate`（寄付する／寄贈する）の名詞形。\n\n## 例文\n- `The names of donors are written on the gates.`（鳥居には寄贈者の名前が書かれている）\n- `She is a blood donor.`（彼女は献血者だ）\n\n## 関連語\n- `donation` = 寄付（行為）\n- `recipient` = 受け取る人（反対）"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"sightseeing spot", choices:["公衆トイレ","観光地","写真撮影禁止区域","休憩所"], answer:1,
       explain:"## 意味\n**sightseeing spot** =「観光地／観光スポット」。\n\n## 語の構成\n`sightseeing`（観光）+ `spot`（場所）。\n\n## 例文\n- `Kyoto has many famous sightseeing spots.`（京都には有名な観光地がたくさんある）\n- `Fushimi-Inari Shrine is the top sightseeing spot for foreign tourists.`（伏見稲荷大社は外国人観光客にとって最上位の観光地だ）\n\n## 似た表現\n- `tourist attraction` = 観光名所\n- `sightseeing destination` = 観光目的地"},
      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"cultural experience", choices:["文化体験","異文化交流学","文化人類学","海外留学"], answer:0,
       explain:"## 意味\n**cultural experience** =「文化体験」。その地域・国の文化を実際に体験すること。\n\n## 例文\n- `Tourists enjoy cultural experiences in Japan, such as wearing kimono.`（観光客は着物を着るなどの文化体験を日本で楽しむ）\n\n## ポイント\nニューツーリズム（new tourism）の中心テーマの 1 つ。観光地を見るだけでなく、実際に体験する旅のスタイル。\n\n## 関連語\n- `cuisine` = 料理\n- `tradition` = 伝統"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"ordinary", choices:["秩序ある","普通の","古代の","公式な"], answer:1, note:"「普段の／ありふれた」。",
       explain:"## 意味\n**ordinary** =「普通の／ありふれた／日常の」。\n\n## 例文\n- `Tourists visit ordinary Japanese homes.`（観光客は普通の日本の家庭を訪れる）\n- `It was just an ordinary day.`（ただの普通の日だった）\n\n## 反対語\n- `extraordinary` = 並外れた／特別な\n- `unusual` = 普通でない\n\n## 注意\n発音は `/ˈɔːrdənˌeri/`（オーディネリ）でアクセントは最初。order（命令）と語源は同じだが意味は別。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"costume", choices:["顧客","衣装","費用","税関"], answer:1,
       explain:"## 意味\n**costume** =「衣装／民族衣装／コスチューム」。\n\n## 例文\n- `Tourists wear ninja costumes in Iga.`（観光客は伊賀で忍者の衣装を着る）\n- `Halloween costumes`（ハロウィンの仮装衣装）\n\n## 紛らわしい語\n- `customer` = 顧客\n- `custom` = 慣習\n- `customs` = 税関 / 慣習\n\n発音もスペルも似ているので要注意。"},
      {prompt:"次の英単語の意味として最も適切なものを選びなさい。", body:"provide", choices:["証明する","提供する","禁止する","予約する"], answer:1,
       explain:"## 意味\n**provide** =「提供する／供給する」。\n\n## 例文\n- `The hotel provides free Wi-Fi.`（そのホテルは無料 Wi-Fi を提供する）\n- `What kind of new tourism does your area provide?`（あなたの地域はどんなニューツーリズムを提供していますか？）\n\n## 文型\n- `provide A`：A を提供する\n- `provide A for B / provide B with A`：B に A を提供する\n\n## 紛らわしい語\n- `prove` = 証明する\n- `proverb` = ことわざ"},
      {prompt:"次の日本語に対応する英単語を選びなさい。", body:"近頃は", choices:["nowhere","nowadays","newly","narrow"], answer:1,
       explain:"## 答え\n**近頃は** = `nowadays`\n\n## 他の選択肢\n- `nowhere` = どこにも〜ない\n- `newly` = 新たに\n- `narrow` = 狭い\n\n## 似た形に注意\n`now`（今）から始まる単語は多いが、意味は全然違う。スペルをしっかり覚えよう。"},
      {prompt:"次の日本語に対応する英単語を選びなさい。", body:"異国風の", choices:["exact","exotic","extra","exit"], answer:1,
       explain:"## 答え\n**異国風の** = `exotic`\n\n## 他の選択肢\n- `exact` = 正確な\n- `extra` = 追加の\n- `exit` = 出口\n\n## ポイント\nどれも `ex-` で始まる紛らわしい単語。スペルをしっかり区別しよう。\n\n## 発音\n`exotic` = `/ɪɡˈzɒtɪk/`（イグゾティック）。第 2 音節にアクセント。"},
      {prompt:"次の日本語に対応する英単語を選びなさい。", body:"数え切れないほどの", choices:["careful","careless","countless","central"], answer:2,
       explain:"## 答え\n**数え切れないほどの** = `countless`\n\n## 語の構成\n`count`（数える）+ `-less`（〜できない）= 数えられない\n\n## 他の選択肢\n- `careful` = 注意深い\n- `careless` = 不注意な\n- `central` = 中心の\n\n## ポイント\n`-less` で「〜できない／〜のない」を作る形容詞は多い：`useless`（無用な）`endless`（終わりのない）`hopeless`（絶望的な）。"},
      {prompt:"文脈に合うものを選びなさい。", body:'Niseko in Hokkaido is now a (   ) for sports tourism.', choices:["museum","mecca","mountain","memory"], answer:1, note:"「スポーツ観光の聖地」。",
       explain:"## 答え\n**mecca**（聖地）が正解。\n\n## 文の意味\n「北海道のニセコは今やスポーツツーリズムの**聖地**となっている。」\n\n## なぜ他は不正解か\n- `museum`（博物館）→ 文脈に合わない\n- `mountain`（山）→ Niseko は山地だが「a mountain for ~」とは言わない\n- `memory`（記憶）→ 完全に意味不明\n\n## ポイント\n`a mecca for ~` =「〜の聖地」は決まり文句。スポーツ・趣味の世界で人々が集まる場所を表す。"},
      {prompt:"文脈に合うものを選びなさい。", body:'Tourists are (   ) fresh experiences.', choices:["selling","seeking","sleeping","sending"], answer:1, note:"are + -ing と be seeking。",
       explain:"## 答え\n**seeking**（探している）が正解。\n\n## 文の意味\n「旅行者は新鮮な体験を**探している**。」\n\n## なぜ他は不正解か\n- `selling` = 売っている → 旅行者が体験を売るのは不自然\n- `sleeping` = 眠っている\n- `sending` = 送っている\n\n## 文法ポイント\n`are seeking` = **現在進行形**（be + -ing）。\n→ 今まさに進行中の動作を表す。\n→ Lesson 1 の文法の中心テーマ。"},
      {prompt:"文脈に合うものを選びなさい。", body:'"Japow" (   ) for "Japanese powder snow."', choices:["stands","stops","stays","stamps"], answer:0, note:"stand for = 〜を表す。",
       explain:"## 答え\n**stands**（〜を表す）が正解。\n\n## 文の意味\n「『ジャパウ』は『日本の粉雪』**を表す**。」\n\n## 熟語\n**stand for ~** =「〜を表す／〜の略語である」\n→ 略語や符号の意味を説明する超頻出表現。\n\n## なぜ他は不正解か\n- `stops` = 止まる\n- `stays` = とどまる\n- `stamps` = 切手を貼る\n\n## ポイント\n主語 \"Japow\" は単数（しかも 3 人称）なので動詞は `-s` がついた `stands`。"},
    ],
    grammar:[
      {prompt:"助動詞の意味として最も適切なものを選びなさい。", body:"can", choices:["〜すべきだ","〜できる","〜にちがいない","〜だろう"], answer:1, note:"can = 〜できる（能力・可能）。",
       explain:"## 答え\n**can** = 「〜できる」（能力・可能性）\n\n## 主な使い方\n- **能力**: `I can speak English.`（私は英語が話せる）\n- **可能性**: `Anyone can make a mistake.`（誰でも間違いはする）\n- **許可**（口語）: `You can use my pen.`（私のペン使っていいよ）\n\n## ポイント\n- 後ろは必ず**動詞の原形**: `can do`, `can swim`\n- 過去形は **could**\n- 否定形は `cannot` または `can't`\n\n## 注意\n3 人称単数でも `cans` にはならない（助動詞だから）。"},
      {prompt:"助動詞の意味として最も適切なものを選びなさい。", body:"will", choices:["〜できる","〜すべきだ","〜だろう","〜かもしれない"], answer:2, note:"will = 〜だろう（未来の予想）。",
       explain:"## 答え\n**will** = 「〜だろう／〜するつもり」（未来・意志）\n\n## 主な使い方\n- **未来の予想**: `It will rain tomorrow.`（明日は雨が降るだろう）\n- **意志**: `I will help you.`（手伝うよ）\n- **習性**: `Boys will be boys.`（男の子は男の子だ）\n\n## ポイント\n- 後ろは**動詞の原形**\n- 否定形は `will not` または `won't`\n- 過去形は **would**\n\n## be going to との違い\n`will` = その場で決めた未来／予想\n`be going to` = 前から決めている予定／確実な兆候"},
      {prompt:"助動詞の意味として最も適切なものを選びなさい。", body:"may", choices:["〜できる","〜かもしれない","〜にちがいない","〜だろう"], answer:1, note:"may = 〜かもしれない（推量）／〜してよい（許可）。",
       explain:"## 答え\n**may** = 「〜かもしれない」（推量）／「〜してよい」（許可）\n\n## 主な使い方\n- **推量**: `It may rain tonight.`（今夜は雨が降るかもしれない）\n- **許可**（フォーマル）: `You may enter.`（入ってよろしい）\n- **許可を求める**: `May I come in?`（入ってもいいですか）\n\n## ポイント\n- 後ろは**動詞の原形**\n- 過去形は **might**（might は現代英語では「〜かもしれない」の控えめ版としても使う）\n\n## 確実さの順\n`must`（90%）> `will`（80%）> `should`（70%）> **`may/might`（50%）** > `could`（30%）"},
      {prompt:"助動詞の意味として最も適切なものを選びなさい。", body:"must", choices:["〜にちがいない・〜しなければならない","〜できる","〜かもしれない","〜だろう"], answer:0, note:"must = 〜にちがいない／〜しなければならない。",
       explain:"## 答え\n**must** には 2 つの主な意味がある：\n\n## ① 強い推量\n「**〜にちがいない**」\n- `You look pale. You must be tired.`（顔色が悪いね。疲れているにちがいない）\n\n## ② 義務\n「**〜しなければならない**」\n- `Students must wear uniforms.`（生徒は制服を着なければならない）\n- `We must leave now.`（もう出発しなければ）\n\n## 否定形に注意\n- `must not` = 「〜してはいけない」（禁止）\n- `don't have to` = 「〜する必要はない」（不要）\n\n意味が全然違うので注意！\n\n## 過去形\n過去形はなく、過去の義務は `had to` を使う。"},
      {prompt:"助動詞の意味として最も適切なものを選びなさい。", body:"should", choices:["〜できる","〜すべきだ","〜してはいけない","〜にちがいない"], answer:1, note:"should = 〜すべきだ（助言）。",
       explain:"## 答え\n**should** = 「〜すべきだ／〜したほうがよい」（助言・義務）\n\n## 主な使い方\n- **助言**: `You should eat more vegetables.`（もっと野菜を食べるべきだ）\n- **当然の予想**: `He should pass the test.`（彼ならテストに合格するはずだ）\n\n## must との違い\n`must` = 強い義務（しなければならない、しないと罰がある）\n`should` = 弱い助言（したほうがよい、けど強制ではない）\n\n## 否定形\n`should not` / `shouldn't` = 「〜すべきでない」\n\n## ポイント\n後ろは**動詞の原形**。`should to ~` は誤り。"},
      {prompt:"助動詞のあとに来る形として正しいものを選びなさい。", body:"You should (   ) more vegetables.", choices:["eats","eat","ate","eating"], answer:1, note:"助動詞の後ろは必ず動詞の原形。",
       explain:"## 答え\n**eat**（動詞の原形）\n\n## ルール（絶対覚える！）\n助動詞のあとは **必ず動詞の原形** がくる。\n\n`can / will / may / must / should + 動詞の原形`\n\n## なぜ他は不正解か\n- `eats`（3 単現）→ 助動詞のあとには絶対に来ない\n- `ate`（過去形）→ 助動詞のあとには絶対に来ない\n- `eating`（-ing 形）→ 助動詞のあとには絶対に来ない\n\n## 文の意味\n「あなたはもっと野菜を**食べるべきだ**」"},
      {prompt:"空所に入る助動詞として最も適切なものを選びなさい。", body:"It is sunny now, but it (   ) rain tonight.", choices:["may","should","can","do"], answer:0, note:"「〜かもしれない」→ may。",
       explain:"## 答え\n**may**（〜かもしれない）\n\n## 文の意味\n「今は晴れているけれど、今夜は雨が降る**かもしれない**。」\n\n## なぜ他は不正解か\n- `should rain`（雨が降るべき？）→ 不自然\n- `can rain`（雨が降れる？）→ 能力の意味になり不自然\n- `do`（助動詞 + 動詞の原形でない）\n\n## ポイント\n「不確実な可能性」を表すのは **may / might** が定番。"},
      {prompt:"空所に入る助動詞として最も適切なものを選びなさい。", body:"You look pale. You (   ) be tired.", choices:["should","must","will","could"], answer:1, note:"「〜にちがいない」（強い推量）→ must。",
       explain:"## 答え\n**must**（〜にちがいない）\n\n## 文の意味\n「顔色が悪いね。疲れている**にちがいない**。」\n\n## ポイント：must の 2 つの意味\n- 義務「〜しなければならない」\n- **強い推量「〜にちがいない」** ← この問題はこっち\n\n見た目や状況から「ほぼ確実にそうだ」と推測するときに使う。\n\n## なぜ他は不正解か\n- `should be tired` = 「疲れているはず」→ やや弱い\n- `will be tired` = 未来の予想（疲れるだろう）\n- `could be tired` = 「疲れているかもしれない」→ 弱い"},
      {prompt:"空所に入る助動詞として最も適切なものを選びなさい。", body:"He studied hard, so he (   ) pass the test.", choices:["should","may not","cannot","must not"], answer:0, note:"「〜すべき／〜のはずだ」→ should。",
       explain:"## 答え\n**should**（〜のはず／〜すべき）\n\n## 文の意味\n「彼は熱心に勉強した。だから、テストに合格する**はずだ**。」\n\n## ポイント\n`should` には 2 つの意味：\n- 助言「〜すべきだ」\n- **当然の予想「〜のはずだ」** ← この問題\n\n根拠（彼は熱心に勉強した）から「合格して当然」と推論。\n\n## なぜ他は不正解か\n- `may not pass` = 合格しないかもしれない → 文脈と矛盾\n- `cannot pass` = 合格できない → 文脈と矛盾\n- `must not pass` = 合格してはいけない → 意味不明"},
      {prompt:"空所に入る助動詞として最も適切なものを選びなさい。", body:"(   ) you speak French?", choices:["Can","Must","Should","Will"], answer:0, note:"能力をたずねる → Can you ~?",
       explain:"## 答え\n**Can**（〜できますか）\n\n## 文の意味\n「あなたはフランス語を話せ**ますか**？」\n\n## ポイント\n相手の**能力**をたずねる時は `Can you ~?` を使う。\n\n## なぜ他は不正解か\n- `Must you speak French?` = フランス語を話さなければなりませんか？\n- `Should you speak French?` = フランス語を話すべきですか？\n- `Will you speak French?` = フランス語を話してくれますか？（依頼）\n\n## 関連表現\n`Can you ~?` は**依頼**にもなる: `Can you help me?`（手伝ってくれる？）"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'She always (___) green tea in the morning.', choices:["drink","drinks","drinking","drank"], answer:1, note:"主語が3人称単数 + 習慣 → 現在形 -s。",
       explain:"## 答え\n**drinks**（3 単現の s）\n\n## 文の意味\n「彼女はいつも朝に緑茶を飲む。」\n\n## ルール: 3 人称単数現在の s\n主語が**3 人称単数**（he / she / it / 人名 など）で、**現在の習慣**を表すとき、動詞に `-s` を付ける。\n\n## ヒントになる副詞\n- `always`（いつも）\n- `usually`（普通）\n- `often`（よく）\n- `every day`（毎日）\n→ これらが出てきたら現在形（習慣）が多い。\n\n## ポイント\n`drink` → `drinks`, `study` → `studies`, `go` → `goes` のように形が変わる。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'The shop (___) at 8 a.m. every day.', choices:["opening","opens","opened","is opening"], answer:1, note:"every day の習慣 → 現在形 -s。",
       explain:"## 答え\n**opens**（3 単現の s）\n\n## 文の意味\n「その店は毎日午前 8 時に開く。」\n\n## ルール\n`every day`（毎日）= **習慣の合図**。\n主語 `the shop`（3 人称単数）+ 習慣 → 現在形 `-s` の `opens`。\n\n## なぜ他は不正解か\n- `opening`（動名詞・分詞）→ 動詞単独では使えない\n- `opened`（過去形）→ 毎日のことなので過去ではない\n- `is opening`（現在進行形）→ 「今まさに開いている最中」の意味になり不自然\n\n## ポイント\n習慣 vs 進行中 を見分けよう：\n- 毎日 / いつも / 普通 → 現在形\n- 今 / 今この瞬間 → 現在進行形"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'Tourists (___) this region for its hot springs.', choices:["love","loves","loving","loved"], answer:0, note:"主語 Tourists は複数 → 原形 love。",
       explain:"## 答え\n**love**（原形のまま）\n\n## 文の意味\n「観光客はその温泉のおかげでこの地域を愛している。」\n\n## ルール\n主語 `Tourists`（観光客たち）は**複数形**。\n複数主語 + 現在の習慣 → 動詞は**原形のまま**（`-s` は付かない）。\n\n## なぜ他は不正解か\n- `loves`（3 単現の s）→ 主語が単数の時だけ\n- `loving`（-ing 形）→ 動詞単独では文にならない\n- `loved`（過去形）→ 現在の気持ちを表したいので過去形は不適\n\n## ポイント\n**主語が単数か複数か**を毎回確認する習慣をつけよう。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'Last weekend, I (___) a famous temple in Kyoto.', choices:["visit","visited","visiting","visits"], answer:1, note:"last weekend → 過去形。",
       explain:"## 答え\n**visited**（過去形）\n\n## 文の意味\n「先週末、私は京都の有名なお寺**を訪れた**。」\n\n## ルール\n`last weekend`（先週末）= **過去の合図**。\n→ 動詞は**過去形**にする。\n\n## 過去の合図になる語\n- `yesterday`（昨日）\n- `last week / month / year`（先週／月／年）\n- `~ ago`（〜前）\n- `in 2020`（具体的な過去の年）\n\n## ポイント\n`visit` の過去形は `visited`（規則変化）。発音は「ヴィジティッド」と 3 音節になる。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'My grandfather (___) a kimono when he was young.', choices:["wear","wore","wearing","wears"], answer:1, note:"when he was young の文脈 → 過去形。",
       explain:"## 答え\n**wore**（過去形）\n\n## 文の意味\n「祖父は若い頃、着物**を着ていた**。」\n\n## ルール\n`when he was young`（若い頃）= 過去の話。\n→ 動詞は**過去形**にする。\n\n## 不規則動詞: wear\n`wear – wore – worn`（着る／着ていた／着られた）\n\n発音は `wore` = `/wɔːr/`（ウォー）。\n\n## ポイント\n衣服や眼鏡・髪型などを「身につけている」状態に `wear` を使う。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'Look! The children (___) in the park right now.', choices:["play","plays","are playing","played"], answer:2, note:"right now → 現在進行形 be + -ing。",
       explain:"## 答え\n**are playing**（現在進行形）\n\n## 文の意味\n「見て！子どもたちが今まさに公園で遊んでいる。」\n\n## ルール: 現在進行形\n`be 動詞（am / is / are）+ 動詞 -ing` = 「今〜している」\n\n## 進行形の合図\n- `Look!` / `Listen!`\n- `now` / `right now`（今）\n- `at the moment`（今のところ）\n- `currently`（今）\n\n## なぜ他は不正解か\n- `play`（原形）→ 主語が複数なので可能だが、`right now` の文脈には合わない\n- `plays`（3 単現）→ 主語 children は複数なので不可\n- `played`（過去）→ now と矛盾\n\n## ポイント\n主語 children は複数 → be 動詞は **are**。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'Don\'t disturb him. He (___) a book.', choices:["reads","read","is reading","was reading"], answer:2, note:"今この瞬間 → 現在進行形。",
       explain:"## 答え\n**is reading**（現在進行形）\n\n## 文の意味\n「彼の邪魔をしないで。彼は本を**読んでいる最中だ**。」\n\n## ルール\n「邪魔しないで」と言っている = 今この瞬間の動作。\n→ 現在進行形（be + -ing）。\n\n## なぜ他は不正解か\n- `reads`（現在形）→ 「毎日本を読む」のような習慣の意味になる\n- `read`（原形・過去形）→ 主語 He なので 3 単現 -s が必要\n- `was reading`（過去進行形）→ Don't disturb は現在の指示\n\n## ポイント\n`disturb` の現在指示形（Don't disturb）と動詞のテンスを揃える。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'When I called him, he (___) his homework.', choices:["does","did","was doing","is doing"], answer:2, note:"過去進行形 was/were + -ing。",
       explain:"## 答え\n**was doing**（過去進行形）\n\n## 文の意味\n「私が彼に電話した**とき**、彼は宿題を**している最中だった**。」\n\n## ルール: 過去進行形\n`was / were + 動詞 -ing` = 「（過去のあるとき）〜している最中だった」\n\n## 典型パターン\n`When + 過去形, 主語 + was/were + -ing`\n→ 「〜したとき、〜していた」\n\n## なぜ他は不正解か\n- `does` / `did` = ただの動作（電話した瞬間に宿題し始めた、ではない）\n- `is doing`（現在進行形）→ 過去の文脈に合わない\n\n## 主語に注意\nhe（単数）→ **was** doing。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'While we (___) near the lake, we saw a beautiful sunset.', choices:["walk","walks","were walking","walked"], answer:2, note:"While + 過去進行形。",
       explain:"## 答え\n**were walking**（過去進行形）\n\n## 文の意味\n「湖の近くを**歩いていたとき**、私たちは美しい夕焼けを見た。」\n\n## ルール: While + 過去進行形\n`While + 主語 + was/were + -ing, 主語 + 過去形`\n→ 「〜している最中に、〜した」\n\n## 主語に注意\nwe（複数）→ **were** walking。\n\n## 似たパターン\n- `When + 過去形 ~, 主語 + was/were + -ing ~`\n- `While + was/were + -ing ~, 主語 + 過去形 ~`\n\n両方 OK だが、While は進行形と相性が良い。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:'When the earthquake struck, we (___) dinner.', choices:["have","had","were having","are having"], answer:2, note:"過去の進行中の動作 → were having。",
       explain:"## 答え\n**were having**（過去進行形）\n\n## 文の意味\n「地震が起きた**とき**、私たちは夕食を**食べていた**。」\n\n## ポイント: have の意味\nここの `have` は「食べる」の意味。\n- `have dinner` = 夕食を食べる\n- `have a meeting` = 会議をする\n- `have a good time` = 楽しい時間を過ごす\n\n## ルール\n過去のある瞬間（地震が起きた瞬間）に**進行中だった**動作 → 過去進行形。\n\n## なぜ他は不正解か\n- `have` / `had`（単純形）→ 動作の進行ニュアンスがない\n- `are having`（現在進行形）→ 過去の文脈に合わない\n\n## 主語\nwe → **were** having。"},

    verbform:[
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'She ( clean ) her room right now.', answer:"is cleaning", alts:["is cleaning."], note:"現在進行形 be + -ing。",
       explain:"## 答え\n**is cleaning**（現在進行形）\n\n## なぜ\n`right now`（今まさに）= 現在進行形の合図。\n→ 主語 She（3 単）+ `be 動詞 + -ing`\n→ `is` + `cleaning`\n\n## 確認\n- 主語が単数 → `is`（she / he / it）\n- 主語が複数 → `are`（we / they）\n- 主語が I → `am`\n\n## 注意\n`clean` → `cleaning`（語尾の e がない単語はそのまま -ing）"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'My brother and I ( walk ) our dog in the park at that time.', answer:"were walking", alts:["were walking."], note:"過去進行形 were + -ing。",
       explain:"## 答え\n**were walking**（過去進行形）\n\n## なぜ\n`at that time`（その時）= 過去のある時点の合図。\n主語 `My brother and I`（**2 人 = 複数**）→ `were` + `-ing`。\n\n## 主語が「A and I」のとき\n常に**複数扱い**。動詞は we と同じ。\n- `My brother and I were ~` ✓\n- `My brother and I was ~` ✗\n\n## 過去進行形のパターン\n`was/were + -ing` = 「〜していた最中だった」"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'Look! It ( rain ) heavily.', answer:"is raining", alts:["is raining."], note:"目の前の動作 → 現在進行形。",
       explain:"## 答え\n**is raining**（現在進行形）\n\n## なぜ\n`Look!` = 今この瞬間に目を向ける合図 → 現在進行形。\n主語 It（3 単）→ `is` + `raining`。\n\n## 天気の it\n天気・時刻・距離などを言うときの主語は **it**（仮主語）。\n- `It is raining.` = 雨が降っている\n- `It is 3 o'clock.` = 3 時です\n- `It is sunny.` = 晴れている\n\n## 注意\n`rain` → `raining`（普通に -ing を付ける）"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'The shrine ( be ) famous for its red gates.', answer:"is", alts:["is."], note:"主語が単数 → is。",
       explain:"## 答え\n**is**（be 動詞・現在）\n\n## なぜ\n- 主語 `The shrine`（神社）= **3 人称単数**\n- 現在の状態（有名である）を表す\n→ be 動詞は `is`\n\n## be 動詞のおさらい\n| 主語 | 現在 | 過去 |\n|------|------|------|\n| I | am | was |\n| he / she / it / 単数 | **is** | was |\n| you / we / they / 複数 | are | were |\n\n## 熟語\n`be famous for ~` = 〜で有名である"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'Last summer, I ( go ) to Kyoto.', answer:"went", alts:["went."], note:"last summer → 過去形 go-went。",
       explain:"## 答え\n**went**（過去形）\n\n## なぜ\n`Last summer`（昨年の夏）= 過去の合図 → 動詞は過去形。\n\n## 不規則動詞: go\n`go – went – gone`\n\n## ポイント\n- 主語 I に関係なく **過去形は went**（s は付かない）\n- 規則動詞は `-ed` を付けるが、go は不規則変化\n\n## 過去の合図ワード\nyesterday / last ~ / ~ ago / in 2020 など。"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'He always ( drink ) coffee in the morning.', answer:"drinks", alts:["drinks."], note:"3単現の s。",
       explain:"## 答え\n**drinks**（3 単現の s）\n\n## なぜ\n- 主語 He = **3 人称単数**\n- `always`（いつも）= 習慣 → 現在形\n→ `drink` + `-s` = `drinks`\n\n## 3 単現の s ルール\n主語が 3 人称（he / she / it / 単数の名詞）かつ現在形 → 動詞に `-s` または `-es` を付ける。\n\n## 例外的な変化\n- `study` → `stud**ies**`（子音 + y → ies）\n- `go` → `go**es**`\n- `have` → `has`（不規則）"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'When the bell rang, the students ( read ) books.', answer:"were reading", alts:["were reading."], note:"過去進行形。",
       explain:"## 答え\n**were reading**（過去進行形）\n\n## なぜ\n`When the bell rang`（ベルが鳴ったとき）= 過去のある瞬間。\nその瞬間に進行中だった動作 → 過去進行形。\n\n主語 `the students`（複数）→ **were** + `-ing`。\n\n## 典型パターン\n`When + 過去形, 主語 + was/were + -ing`\n→「〜したとき、〜していた」\n\n## 注意\n`read` の現在形と過去形はスペル同じだが発音が違う：\n- 現在 `read` = `/riːd/`（リード）\n- 過去 `read` = `/rɛd/`（レッド）"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'You can ( see ) Mt. Fuji from here.', answer:"see", alts:["see."], note:"助動詞 can の後ろは原形。",
       explain:"## 答え\n**see**（動詞の原形）\n\n## なぜ\n**助動詞のあとは必ず動詞の原形！**\n`can / will / may / must / should + 動詞の原形`\n\n## 不正解になりがちなパターン\n- `can sees` ✗\n- `can saw` ✗\n- `can seeing` ✗\n- **`can see` ✓**\n\n## 注意\n主語が You でも、3 人称単数 he/she/it でも、助動詞のあとは原形のまま：\n- `He can see Mt. Fuji.` ✓（cans にはならない）"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'Tourists ( visit ) Kyoto every spring.', answer:"visit", alts:["visit."], note:"複数主語 + 習慣 → 原形。",
       explain:"## 答え\n**visit**（原形のまま）\n\n## なぜ\n- 主語 `Tourists`（観光客たち）= **複数**\n- `every spring`（毎春）= 習慣\n→ 現在形だが、複数主語なので **-s は付かない**\n\n## ルール\n主語が複数 (we / they / 複数名詞) → 動詞は原形のまま。\n\n## 確認\n- `Tourists visit ~.`（複数主語）→ visit ✓\n- `A tourist visits ~.`（単数主語）→ visits ✓"},
      {prompt:"カッコ内の語を適切な形に変えなさい。", body:'My mother ( cook ) dinner right now.', answer:"is cooking", alts:["is cooking."], note:"現在進行形。",
       explain:"## 答え\n**is cooking**（現在進行形）\n\n## なぜ\n`right now`（今まさに）= 現在進行形の合図。\n主語 `My mother`（3 単）→ `is` + `cooking`。\n\n## 構造\n`be 動詞 + 動詞 -ing` = 今〜している最中\n\n## 注意\n`cook` → `cooking`（普通に -ing）。スペルを変えなくて OK。"},

    arrange:[

       answer:"She is cleaning her room right now", note:"現在進行形 + 副詞 right now。",
       explain:"## 並べ方の手順\n1. 主語: **She**\n2. be 動詞 + -ing: **is cleaning**（現在進行形）\n3. 目的語: **her room**\n4. 副詞: **right now**\n\n## ルール\n現在進行形 = `be 動詞 + 動詞 -ing` で「今〜している」\n\n## 語順のコツ\n副詞句（right now / at that time など）は文末に置くのが基本。"},
      {prompt:"日本語の意味になるように英語を並べ替えなさい。", body:"そのとき、弟と私は公園で犬を散歩させていました。",

      {prompt:"日本語の意味になるように英語を並べ替えなさい。", body:"その神社は数え切れないほどの赤い鳥居で有名です。",
       scramble:["The","shrine","famous","is","for","its","countless","red","torii","gates"],
       answer:"The shrine is famous for its countless red torii gates", note:"be famous for ~ で「〜で有名」。",
       explain:"## 並べ方の手順\n1. 主語: **The shrine**\n2. be 動詞 + 形容詞: **is famous**\n3. 熟語: **for ~**\n4. 名詞のかたまり: **its countless red torii gates**\n\n## 熟語\n`be famous for ~` = 〜で有名である\n\n## 名詞のかたまりの語順\n冠詞 / 所有格 → 形容詞 → 名詞 の順。\n- its（所有）→ countless（形容詞）→ red（形容詞）→ torii（修飾名詞）→ gates（中心名詞）"},
      {prompt:"日本語の意味になるように英語を並べ替えなさい。", body:"観光だけでなく、ニューツーリズムも人気です。",

       answer:"Not only sightseeing but also new tourism is popular", note:"not only A but also B。",
       explain:"## 並べ方の手順\n1. 構文: **Not only A but also B**\n2. A = **sightseeing**\n3. B = **new tourism**\n4. 動詞: **is popular**\n\n## ルール\n`Not only A but also B + 動詞`\n→ 動詞は **B に一致** させる（new tourism は単数 → is）\n\n## 別解\n通常の語順では `New tourism, as well as sightseeing, is popular.` でも同じ意味。"},

      {prompt:"日本語の意味になるように英語を並べ替えなさい。", body:"明日は雨が降るかもしれません。",

       explain:"## 並べ方の手順\n1. 仮主語: **It**（天気の it）\n2. 助動詞: **may**（〜かもしれない）\n3. 動詞の原形: **rain**\n4. 副詞: **tomorrow**\n\n## ポイント\n- 天気の文の主語は **It**\n- 助動詞のあとは**動詞の原形**\n- `may` = 不確実な可能性（50% くらい）\n\n## 似た言い方\n- `It might rain ~.`（might も同じ意味でやや弱い）"},
      {prompt:"日本語の意味になるように英語を並べ替えなさい。", body:"私たちはこの神社を訪れるべきです。",

       choices:["その神社は赤い鳥居をいくつか持っている。","その神社は数え切れないほどの赤い鳥居で有名です。","その神社の鳥居は赤くなく、数えやすい。","その神社は鳥居が少なくて人気がない。"], answer:1,

      {prompt:"次の英文の和訳として最も適切なものを選びなさい。", body:'Tourists are seeking fresh experiences.',
       choices:["旅行者は古い体験を売っている。","旅行者は経験を求めていない。","旅行者は新鮮な体験を探している。","観光客は新しい場所に行きたくない。"], answer:2,

      {prompt:"次の英熟語の意味として最も適切なものを選びなさい。", body:"look for ...", choices:["…を見ない","…を尊敬する","…を探す","…を見つけたあと放す"], answer:2,

    grammar:[
      {prompt:"受動態の基本形を選びなさい。", body:"The ball is (   ) by him.", choices:["kick","kicks","kicked","kicking"], answer:2, note:"be + 過去分詞。kick→kicked。",
       explain:"## 受動態の基本形\n**`be 動詞 + 過去分詞 (p.p.)`** = 〜される／〜された\n\n## この問題\n`is + kicked`（kick の過去分詞）\n→ 「ボールは彼に蹴られる」\n\n## ポイント\n- 主語が「される側」になるのが受動態\n- 動作主は `by ~` で示す（省略可）\n\n## 動詞の変化\n`kick – kicked – kicked`（規則動詞）"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:"Math (   ) by Mr. Yatsumonji.", choices:["teach","teaches","is taught","is teaching"], answer:2, note:"主語が物 → 受け身（現在）。",
       explain:"## なぜ受動態か\n主語 `Math`（数学）は「教えられる側」。\n→ `be 動詞 + 過去分詞` の形にする。\n\n## 不規則変化\n`teach – taught – taught`\n→ 過去分詞は **taught**\n\n## 文の意味\n「数学は八ツ門寺先生によって教えられている」\n\n## 配付プリント直結\nこの文は先生のプリントに登場した典型例。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:"This car (   ) in Japan.", choices:["made","is made","was made","was making"], answer:2, note:"過去の受け身。",
       explain:"## 過去の受動態\n`was/were + 過去分詞` = 〜された（過去）\n\n## 不規則変化\n`make – made – made`\n→ 過去分詞は **made**\n\n## 主語の数\n主語 `This car`（単数）→ **was** made\n\n## 文の意味\n「この車は日本で作られた」"},
      {prompt:"次の文を受動態に直した文として正しいものを選びなさい。", body:"He kicks the ball.", choices:["The ball kick by him.","The ball is kicked by him.","The ball was kicked by him.","The ball kicks him."], answer:1, note:"現在形の能動 → 現在形の受動 is + 過去分詞。",
       explain:"## 能動 → 受動の手順\n1. 元の文の **目的語**（the ball）を新しい主語にする\n2. 動詞は `be 動詞 + 過去分詞` に変える\n3. 元の主語は `by ~` にする\n\n## この問題\n- 元: He **kicks** the ball.（現在形）\n- 受動: The ball **is kicked** by him.\n\n## 時制を保つ\n元が現在形 → 受動も現在形（is + p.p.）\n元が過去形 → 受動も過去形（was + p.p.）"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:"I (   ) not invited to the party.", choices:["was","were","am","do"], answer:0, note:"否定の受動態は be 動詞のあとに not。",
       explain:"## 否定の受動態\n`be 動詞 + not + 過去分詞`\n→ be 動詞のあとに not を入れる\n\n## 主語に合わせる\n主語 I + 過去 → **was** not\n（I → was / he/she/it → was / you/we/they → were）\n\n## 文の意味\n「私はパーティーに招待されなかった」\n\n## 配付プリント直結\n先生のプリント B-(4) と同じ形。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:"The book is read (   ) many people.", choices:["with","of","by","in"], answer:2, note:"受動態で動作主は by ~。",
       explain:"## 動作主の前置詞\n受動態で「〜によって」を表すのは **`by`**\n\n## 文の意味\n「その本は多くの人に読まれている」\n\n## by 以外も使う場合\n- `be interested **in** ~`（〜に興味がある）\n- `be made **of/from** ~`（〜でできている）\n- `be filled **with** ~`（〜で満たされている）\n\nこれらは慣用的な熟語として覚える。"},
      {prompt:"空所に入れるのに最も適切なものを選びなさい。", body:"The shrine was built 300 years (   ).", choices:["before","since","ago","for"], answer:2, note:"〜前 = ~ ago。",
       explain:"## 「〜前」の表し方\n**過去の文 + ~ ago** = 〜前に\n\n## 例\n- `300 years ago` = 300 年前に\n- `two days ago` = 2 日前に\n\n## ポイント：紛らわしい語\n- **ago** = 過去形と一緒に（過去から見て前）\n- **before** = 過去より前（過去完了で使う）\n- **for** = 〜の間\n- **since** = 〜から（起点）"},
      {prompt:"次の英文が表す現在完了の用法を選びなさい。", body:"They have just got to the station.", choices:["完了","経験","継続","進行"], answer:0, note:"just「ちょうど〜したところだ」→ 完了。",

/* ============================================================
   State & persistence
   ============================================================ */
const STORE_KEY = "gakushucho_eigo_v1";
const State = {
  lesson:1,
  mode:"vocab",
  q:0,
  score:{good:0,bad:0},
  showFeedback:false,
  selected:null,
  freeText:"",
  done:false,
  progress:{},        // {1:{vocab:.., grammar:.., ...}, ...}
  review:[],          // wrong-answer bank
  pool:null,          // current question pool (cached)
};

function saveStore(){
  const data={progress:State.progress, review:State.review};
  try{localStorage.setItem(STORE_KEY, JSON.stringify(data));}catch(e){}
}
function loadStore(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const d=JSON.parse(raw);
    State.progress=d.progress||{};
    State.review=d.review||[];
  }catch(e){}
}

function getPool(lesson, mode){
  const data=QUESTIONS[lesson];
  if(!data) return [];
  if(mode==="reading"){
    const r=data.reading?.[0];
    if(!r) return [];
    return r.questions.map(q=>({...q, _passage:r}));
  }
  return data[mode]||[];
}

/* ============================================================
   Rendering
   ============================================================ */
const sheet = document.getElementById("sheet");
const tabStrip = document.getElementById("lessonTabs");

function renderTabs(){
  tabStrip.innerHTML="";
  LESSONS.forEach(L=>{
    const b=document.createElement("button");
    b.className="lesson-tab"+(State.lesson===L.n?" active":"");
    b.style.setProperty("--tab-color", `var(${L.color})`);
    b.dataset.n=L.n;
    b.innerHTML=`<span class="num">Lesson ${L.n}</span><span class="ttl">${L.title}</span>`;
    b.onclick=()=>{
      State.lesson=L.n; State.mode="vocab"; resetQuiz(); render();
    };
    tabStrip.appendChild(b);
  });
}

function getLessonProgress(lessonN){
  const p=State.progress[lessonN];
  if(!p) return 0;
  const vals=Object.values(p);
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function updatePauseButtonVisibility(){
  const btn = document.getElementById("pauseBtn");
  if(!btn) return;
  // クイズ中（出題中）のみ表示。done/placeholder のときは隠す。
  const visible = !!(State.pool && !State.done && State.q < (State.pool?.length||0));
  btn.style.display = visible ? "inline-flex" : "none";
}

function pauseQuiz(){
  if(!State.pool || State.done) return;
  if(!confirm("今のクイズを中断します。これまでの結果サマリーを表示します。")){
    return;
  }
  // 強制的に終了 → サマリーへ
  State.done = true;
  commitProgress();
  renderSummary(true /* fromPause */);
  updatePauseButtonVisibility();
}

function render(){
  renderTabs();
  const L=LESSONS.find(l=>l.n===State.lesson);
  const pool=getPool(State.lesson, State.mode);
  const has = pool && pool.length;

  let html=`
  <div class="lesson-head">
    <div class="titles">
      <h2><span class="lesson-num" style="background:var(${L.color})">LESSON ${L.n}</span>${L.title}</h2>
      <div class="theme">テーマ: <b>${L.theme}</b> ／ 文法: <b>${L.grammar}</b></div>
    </div>
    <div class="progress-card">
      <div class="label">LESSON PROGRESS</div>
      <div class="pct">${getLessonProgress(L.n)}%</div>
      <div class="bar"><i style="--tab-color:var(${L.color});width:${getLessonProgress(L.n)}%"></i></div>
    </div>
  </div>
  <div class="mode-row">
    ${MODES.map(m=>`<button data-mode="${m.id}" class="${m.id===State.mode?'active':''}"><span class="glyph">${m.glyph}</span>${m.label}</button>`).join("")}
  </div>
  <div class="qarea" id="qarea"></div>`;
  sheet.innerHTML=html;
  // set tab color CSS var on sheet for accents
  sheet.style.setProperty("--tab-color", `var(${L.color})`);

  sheet.querySelectorAll(".mode-row button").forEach(b=>{
    b.onclick=()=>{ State.mode=b.dataset.mode; resetQuiz(); render(); };
  });

  if(!has){
    renderPlaceholder();
  }else{
    renderQuiz();
  }
  updateReviewFab();
  updatePauseButtonVisibility();
}

function renderPlaceholder(){
  document.getElementById("qarea").innerHTML=`
  <div class="placeholder">
    <span class="glyph">📓</span>
    <h3>このセクションは準備中です</h3>
    <p>Lesson ${State.lesson} の「${MODES.find(m=>m.id===State.mode).label}」は近日リリース予定です。</p>
    <span class="badge">Lesson 1 と Lesson 2 でひととおりお試しできます</span>
  </div>`;
}

function resetQuiz(){
  State.q=0; State.score={good:0,bad:0};
  State.showFeedback=false; State.selected=null; State.freeText="";
  State.done=false; State.pool=null;
}

function renderQuiz(){
  if(!State.pool){
    const p=getPool(State.lesson, State.mode);
    // shallow shuffle for variety on each session
    State.pool=[...p].sort(()=>Math.random()-0.5);
  }
  const total=State.pool.length;
  if(State.done){ renderSummary(); return; }
  const q=State.pool[State.q];
  if(!q){ State.done=true; renderSummary(); return; }

  const area=document.getElementById("qarea");
  const isReading = State.mode==="reading";
  // Determine effective type for this question (test mode uses q.type, others use mode)
  const effType = q.type || State.mode;
  const isWriting   = effType==="writing";
  const isTranslate = effType==="translate";
  const isVerbForm  = effType==="verbform";
  const isArrange   = effType==="arrange";
  const isFreeInput = isWriting || isTranslate || isVerbForm;

  let qbodyClass="qbody";
  if(/^[ぁ-んァ-ヶ一-龯、。「」]/.test((q.body||"")[0]||"")) qbodyClass+=" ja";

  // Body for arrange = the Japanese sentence to translate
  let bodyHtml = formatBody(q.body);
  if(isArrange){
    // ensure JA styling
    qbodyClass = "qbody ja";
  }

  let inputHtml = "";
  if(isArrange)        inputHtml = renderArrange(q);
  else if(isVerbForm)  inputHtml = renderVerbForm(q);
  else if(isFreeInput) inputHtml = renderWriting(q, isTranslate);
  else                 inputHtml = renderChoices(q);

  let html=`
  <div class="qmeta">
    <div class="step">問 ${State.q+1} <span style="opacity:.5"> / ${total}</span></div>
    <div class="score">○ <b class="good">${State.score.good}</b> &nbsp; × <b class="bad">${State.score.bad}</b></div>
  </div>
  ${isReading?`
    <div class="q-card">
      <div class="reading-passage">
        <h4>READING PASSAGE</h4>
        ${escapeHtml(q._passage.passage).replace(/\n\n/g,'</p><p style="margin-top:10px">').replace(/^/,'<p>')}</p>
        <p style="text-align:right;margin-top:8px;font-style:italic;color:var(--ink-soft);font-size:13px">— ${escapeHtml(q._passage.title)}</p>
      </div>
    </div>`:""}
  <div class="q-card">
    <span class="qno">Q${State.q+1}</span>
    <div class="qprompt">${escapeHtml(q.prompt||"")}</div>
    <div class="${qbodyClass}">${bodyHtml}</div>
    ${inputHtml}
    <div class="feedback" id="fb"></div>
    <div class="q-actions">
      <button class="btn primary" id="checkBtn" ${isFreeInput||isArrange?"":"disabled"}>採点する</button>
      <button class="btn ghost" id="nextBtn" style="display:none">次の問題 →</button>
      <button class="btn explain-btn" id="explainBtn" style="display:none"><span class="ic">📖</span>もっと詳しく</button>
      <button class="btn ghost" id="skipBtn">スキップ</button>
    </div>
  </div>`;
  area.innerHTML=html;

  // wire actions per type
  if(isArrange){
    setupArrange();
    document.getElementById("checkBtn").onclick=()=>checkArrange(q);
  }else if(isVerbForm){
    const inp=area.querySelector("input.text-fill");
    inp.addEventListener("input", e=>{ State.freeText=e.target.value; });
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); checkVerbForm(q); }});
    document.getElementById("checkBtn").onclick=()=>checkVerbForm(q);
  }else if(isFreeInput){
    const ta=area.querySelector("textarea.answer-input");
    ta.addEventListener("input", e=>{ State.freeText=e.target.value; });
    document.getElementById("checkBtn").onclick=()=>checkWriting(q, isTranslate);
  }else{
    area.querySelectorAll(".choice").forEach(btn=>{
      btn.onclick=()=>{
        if(State.showFeedback) return;
        State.selected=Number(btn.dataset.i);
        area.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        document.getElementById("checkBtn").disabled=false;
      };
    });
    document.getElementById("checkBtn").onclick=()=>checkChoice(q);
  }
  document.getElementById("nextBtn").onclick=nextQuestion;
  document.getElementById("skipBtn").onclick=()=>{ nextQuestion(true); };
}

function renderChoices(q){
  return `<div class="choices">${q.choices.map((c,i)=>
    `<button class="choice" data-i="${i}">
       <span class="mark">${"ABCD"[i]}</span>
       <span>${escapeHtml(c)}</span>
     </button>`).join("")}</div>`;
}

function renderWriting(q, ja=false){
  const cls = "answer-input" + (ja?" ja":"");
  const ph  = ja ? "ここに日本語で和訳を入力" : "ここに英語で解答を入力";
  return `<textarea class="${cls}" placeholder="${ph}" autofocus>${escapeHtml(State.freeText||"")}</textarea>`;
}

function renderVerbForm(q){
  return `<div class="text-fill-row">
    <label>カッコ内の語を適切な形に →</label>
    <input type="text" class="text-fill" placeholder="例: is cleaning" value="${escapeHtml(State.freeText||"")}" autofocus>
  </div>`;
}

function renderArrange(q){
  // Shuffle the words once and cache on the question (so user sees the same shuffle within this question)
  if(!q._shuffle){
    const arr = [...q.scramble];
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    q._shuffle = arr;
  }
  const pool = q._shuffle;
  return `<div class="arrange-area">
    <div class="arrange-answer" id="arrAns">
      <span class="placeholder">↓ 下から順にタップして英文を組み立てよう</span>
    </div>
    <div class="arrange-pool" id="arrPool">
      ${pool.map((w,i)=>`<button class="word-chip" data-w="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join("")}
    </div>
  </div>`;
}

function setupArrange(){
  const pool = document.getElementById("arrPool");
  const ans  = document.getElementById("arrAns");
  function refreshPlaceholder(){
    if(!ans.querySelector(".word-chip")){
      if(!ans.querySelector(".placeholder")){
        const ph=document.createElement("span");
        ph.className="placeholder";
        ph.textContent="↓ 下から順にタップして英文を組み立てよう";
        ans.appendChild(ph);
      }
    } else {
      ans.querySelector(".placeholder")?.remove();
    }
  }
  document.querySelectorAll(".arrange-area .word-chip").forEach(btn=>{
    btn.onclick = () => {
      if(State.showFeedback) return;
      if(btn.parentElement === pool){
        ans.querySelector(".placeholder")?.remove();
        ans.appendChild(btn);
      } else {
        pool.appendChild(btn);
        refreshPlaceholder();
      }
    };
  });
}

function normalizeArrangeWord(w){
  return String(w||"").toLowerCase()
    .replace(/[.,!?;:"']/g,"")
    .trim();
}
function checkArrange(q){
  const ans=document.getElementById("arrAns");
  const userWords = [...ans.querySelectorAll(".word-chip")].map(c=>c.dataset.w);
  if(userWords.length === 0){
    alert("並べてから採点してください。");
    return;
  }
  const expected = q.answer.split(/\s+/);
  const a = userWords.map(normalizeArrangeWord).join(" ");
  const b = expected.map(normalizeArrangeWord).join(" ");
  let ok = (a===b);
  if(!ok && q.alts){
    for(const alt of q.alts){
      const c = alt.split(/\s+/).map(normalizeArrangeWord).join(" ");
      if(a===c){ ok=true; break; }
    }
  }
  State.showFeedback=true;
  // lock chips
  document.querySelectorAll(".arrange-area .word-chip").forEach(c=>c.disabled=true);
  showFeedback(ok, q, true, userWords.join(" "));
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
  showExplainButton(q);
}

function checkVerbForm(q){
  const ans=(State.freeText||"").trim();
  if(!ans){ alert("解答を入力してください。"); return; }
  State.showFeedback=true;
  const ok = isWritingCorrect(ans, q);
  showFeedback(ok, q, true, ans);
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
  document.querySelector("input.text-fill").disabled=true;
  showExplainButton(q);
}

function checkChoice(q){
  if(State.selected==null) return;
  State.showFeedback=true;
  const area=document.getElementById("qarea");
  area.querySelectorAll(".choice").forEach((b,i)=>{
    b.classList.add("locked");
    if(i===q.answer) b.classList.add("correct");
    if(i===State.selected && i!==q.answer) b.classList.add("wrong");
  });
  const ok=(State.selected===q.answer);
  showFeedback(ok, q);
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
  showExplainButton(q);
}

function checkWriting(q, ja=false){
  const ans=(State.freeText||"").trim();
  if(!ans){ alert("解答を入力してください。"); return; }
  State.showFeedback=true;
  const ok = ja ? isJaCorrect(ans, q) : isWritingCorrect(ans, q);
  showFeedback(ok, q, true, ans);
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
  document.querySelector("textarea.answer-input").disabled=true;
  showExplainButton(q);
}

function normalize(s){
  return s.toLowerCase()
    .replace(/[’‘`´]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function isWritingCorrect(input, q){
  const cand=[q.answer, ...(q.alts||[])].map(normalize);
  const n=normalize(input);
  return cand.includes(n);
}
function normalizeJa(s){
  return String(s||"")
    .replace(/[、。．，！？「」『』 　\s　]/g,"")
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60)) // katakana→hiragana
    .toLowerCase();
}
function isJaCorrect(input, q){
  const cand=[q.answer, ...(q.alts||[])].map(normalizeJa);
  const n=normalizeJa(input);
  // exact match or partial - require >= 70% character overlap
  if(cand.includes(n)) return true;
  // permissive: if user's answer contains all expected keywords from any cand
  for(const c of cand){
    if(c.length>0 && n.length>=Math.floor(c.length*0.7)){
      // count shared chars
      const setC=new Set(c);
      let shared=0;
      for(const ch of n){ if(setC.has(ch)) shared++; }
      if(shared >= Math.floor(c.length*0.7)) return true;
    }
  }
  return false;
}

function showFeedback(ok, q, writingMode=false, userInput=""){
  const fb=document.getElementById("fb");
  fb.classList.add("show");
  fb.classList.remove("good","bad");
  fb.classList.add(ok?"good":"bad");
  let html="";
  if(ok){
    html += `<span class="stamp">◎ 正解！</span>${escapeHtml(q.note||"よく出来ました。")}`;
  }else{
    html += `<span class="stamp">× 不正解</span>もう一度確認しましょう。`;
    if(!writingMode){
      html += `<span class="ans-line">正解: <b>${"ABCD"[q.answer]}. ${escapeHtml(q.choices[q.answer])}</b></span>`;
    }else{
      html += `<span class="ans-line">模範解答: <b>${escapeHtml(q.answer)}</b></span>`;
      if(q.alts && q.alts.length){
        html += `<span class="ja-hint">他の許容例: ${q.alts.map(a=>`「${escapeHtml(a)}」`).join(" / ")}</span>`;
      }
      html += `<span class="ja-hint">あなたの解答: ${escapeHtml(userInput)}</span>`;
    }
    if(q.note) html += `<span class="ja-hint">ヒント: ${escapeHtml(q.note)}</span>`;
  }
  fb.innerHTML=html;
}

function nextQuestion(skip=false){
  if(skip && !State.showFeedback){
    State.score.bad++; addToReview(State.pool[State.q]);
  }
  State.q++;
  State.showFeedback=false;
  State.selected=null;
  State.freeText="";
  if(State.q>=State.pool.length){ State.done=true; commitProgress(); renderSummary(); return; }
  renderQuiz();
}

/* ============================================================
   Explanation modal
   ============================================================ */
function showExplainButton(q){
  const btn = document.getElementById("explainBtn");
  if(!btn) return;
  if(q.explain){
    btn.style.display = "inline-flex";
    btn.onclick = () => openExplainModal(q);
  } else {
    btn.style.display = "none";
  }
}

function renderMarkdown(s){
  if(!s) return "";
  // Already-rendered HTML pass-through if it has tags? No—always parse as markdown-lite.
  let html = String(s);
  // Sections with headers: lines starting with "## " → <h4>
  // First protect existing line breaks
  const lines = html.split("\n");
  let out = [];
  let inList = false;
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    // Strip trailing/leading spaces
    line = line.trim();
    if(line === ""){
      if(inList){ out.push("</ul>"); inList=false; }
      continue;
    }
    // Header
    if(/^##\s+/.test(line)){
      if(inList){ out.push("</ul>"); inList=false; }
      out.push(`<h4>${inlineFmt(line.replace(/^##\s+/,""))}</h4>`);
      continue;
    }
    // Bullet
    if(/^[\-•*]\s+/.test(line)){
      if(!inList){ out.push("<ul>"); inList=true; }
      out.push(`<li>${inlineFmt(line.replace(/^[\-•*]\s+/,""))}</li>`);
      continue;
    }
    // Para
    if(inList){ out.push("</ul>"); inList=false; }
    out.push(`<p>${inlineFmt(line)}</p>`);
  }
  if(inList) out.push("</ul>");
  return out.join("");

  function inlineFmt(s){
    // Escape HTML first
    let r = String(s).replace(/[&<>"']/g, c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
    // **bold**
    r = r.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    // `code`
    r = r.replace(/`([^`]+)`/g, "<code>$1</code>");
    // _italic_ (CrimsonPro)
    r = r.replace(/(^|\s)_([^_]+)_/g, "$1<em>$2</em>");
    return r;
  }
}

function openExplainModal(q){
  let recapAns = "";
  if(q.choices && typeof q.answer === "number"){
    recapAns = `${"ABCD"[q.answer]}. ${q.choices[q.answer]}`;
  } else if(typeof q.answer === "boolean"){
    recapAns = q.answer ? "○ (正しい)" : "× (誤り)";
  } else {
    recapAns = q.answer;
  }
  let html = `
    <button class="close" id="closeModal">×</button>
    <h3>📖 解説</h3>
    <div class="explain-q-recap">
      <span class="lbl">問題</span>
      <div class="q">${escapeHtml(q.body || "")}</div>
      <div class="a">正解 / 模範解答: ${escapeHtml(recapAns)}</div>
    </div>
    <div class="explain-body">${renderMarkdown(q.explain)}</div>
    <div style="margin-top:18px;text-align:right">
      <button class="btn primary" id="closeExplainBtn">閉じる</button>
    </div>
  `;
  modalBody.innerHTML = html;
  modalBg.classList.add("show");
  document.getElementById("closeModal").onclick = closeReview;
  document.getElementById("closeExplainBtn").onclick = closeReview;
}

function addToReview(q){
  // dedupe by body
  if(!State.review.find(r=>r.body===q.body && r.lesson===State.lesson && r.mode===State.mode)){
    State.review.push({
      lesson:State.lesson, mode:State.mode,
      body:q.body, prompt:q.prompt,
      answer:q.choices? q.choices[q.answer] : q.answer,
      note:q.note||""
    });
    saveStore();
  }
}

function commitProgress(){
  const total=State.score.good+State.score.bad;
  const pct = total? Math.round(100*State.score.good/total):0;
  State.progress[State.lesson] = State.progress[State.lesson] || {};
  State.progress[State.lesson][State.mode] = pct;
  saveStore();
}

function renderSummary(fromPause=false){
  const area=document.getElementById("qarea");
  const total=State.score.good+State.score.bad;
  const pct = total? Math.round(100*State.score.good/total):0;
  let stamp="もう一度復習しましょう。";
  if(pct>=90) stamp="満点近し！素晴らしい";
  else if(pct>=70) stamp="よくできました";
  else if(pct>=50) stamp="あと一歩";
  const heading = fromPause
    ? `${MODES.find(m=>m.id===State.mode).label} ・ 中断しました`
    : `${MODES.find(m=>m.id===State.mode).label} ・ 結果`;
  const subtext = fromPause
    ? `${State.score.good + State.score.bad} 問終了時点 / 全 ${State.pool?.length || 0} 問`
    : `${State.score.good} / ${total} 問正解`;
  area.innerHTML=`
  <div class="summary">
    <h3>${heading}</h3>
    <div class="score-big">${pct}<small>%</small></div>
    <div>${subtext}</div>
    <div class="stamp-circle">${fromPause?"おつかれさま":stamp}</div>
    <div class="row">
      <button class="btn primary" id="againBtn">${fromPause?"続きから / もう一度":"もう一度"}</button>
      <button class="btn accent" id="nextModeBtn">次のモードへ</button>
      <button class="btn ghost" id="goReviewBtn">復習帳を見る</button>
      <a class="btn ghost" href="./" style="text-decoration:none;display:inline-flex;align-items:center">🏠 学習帖トップへ</a>
    </div>
  </div>`;
  document.getElementById("againBtn").onclick=()=>{ resetQuiz(); render(); };
  document.getElementById("nextModeBtn").onclick=()=>{
    const idx=MODES.findIndex(m=>m.id===State.mode);
    State.mode=MODES[(idx+1)%MODES.length].id;
    resetQuiz(); render();
  };
  document.getElementById("goReviewBtn").onclick=openReview;
  updateReviewFab();
  updatePauseButtonVisibility();
}

/* ============================================================
   Review (復習帳) modal
   ============================================================ */
const modalBg=document.getElementById("modalBg");
const modalBody=document.getElementById("modalBody");

function openReview(){
  let html=`
    <button class="close" id="closeModal">×</button>
    <h3>☆ 復習帳</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:8px">間違えた問題が自動で集まります。</p>`;
  if(!State.review.length){
    html += `<p style="margin-top:18px;color:var(--ink-soft)">まだ登録された問題はありません。問題を解くと、間違えたものがここに集まります。</p>`;
  }else{
    html += State.review.map((r,i)=>{
      const L=LESSONS.find(l=>l.n===r.lesson);
      return `<div class="item">
        <div class="q">${escapeHtml(r.body)}</div>
        <div class="a">正解: <b>${escapeHtml(r.answer)}</b></div>
        ${r.note?`<div class="a" style="color:var(--ink-soft)">ヒント: ${escapeHtml(r.note)}</div>`:""}
        <div class="tags">Lesson ${L.n} ${L.title} / ${MODES.find(m=>m.id===r.mode)?.label||r.mode}</div>
      </div>`;
    }).join("");
    html += `<div style="margin-top:18px;text-align:right">
      <button class="btn ghost" id="clearReviewBtn">復習帳を空にする</button>
    </div>`;
  }
  modalBody.innerHTML=html;
  modalBg.classList.add("show");
  document.getElementById("closeModal").onclick=closeReview;
  const cl=document.getElementById("clearReviewBtn");
  if(cl) cl.onclick=()=>{ if(confirm("復習帳をすべて削除しますか？")){ State.review=[]; saveStore(); openReview(); updateReviewFab(); }};
}
function closeReview(){ modalBg.classList.remove("show"); }
modalBg.addEventListener("click", e=>{ if(e.target===modalBg) closeReview(); });

function updateReviewFab(){
  document.getElementById("reviewCount").textContent=State.review.length;
}
document.getElementById("reviewFab").onclick=openReview;

/* ============================================================
   Helpers
   ============================================================ */
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g, c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));}
function formatBody(s){
  // turn (___) into a styled blank
  return escapeHtml(s||"").replace(/\(\s*_+\s*\)/g, '<span class="blank">　　　</span>');
}

/* ============================================================
   Boot
   ============================================================ */
loadStore();
render();

// Wire pause button (header)
document.getElementById("pauseBtn")?.addEventListener("click", pauseQuiz);

/* Register service worker for offline use (only on https / localhost) */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
