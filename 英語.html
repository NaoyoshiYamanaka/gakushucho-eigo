<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>学習帖 — 英語 / Power On English Communication I</title>

<!-- PWA: manifest & theme -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF7F0">
<meta name="color-scheme" content="light">

<!-- iOS specific -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学習帖・英語">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   学習帖 — 英語  |  Design system
   ============================================================ */
:root{
  --paper:#FAF7F0;
  --paper-edge:#EFE9D9;
  --ink:#2C2C2C;
  --ink-soft:#5C5854;
  --rule:#D9D3C2;          /* notebook rule line */
  --rule-soft:#EDE6D2;
  --accent:#E8743C;        /* Power On orange */
  --accent-deep:#C45A26;
  --indigo:#1F4068;        /* tab indigo */
  --indigo-soft:#3A5A85;
  --good:#3C8A5A;
  --bad:#C4523A;
  --shadow:0 4px 20px rgba(60,40,20,.08);
  --shadow-deep:0 12px 40px rgba(60,40,20,.15);
  --tab-1:#E8743C; --tab-2:#3A8A8A; --tab-3:#7A4E9A;
  --tab-4:#C44A6A; --tab-5:#5A9A3C; --tab-6:#3C6AC4;
  --tab-7:#2C8A7A; --tab-8:#C49A2C; --tab-9:#9A4C3C;
  --tab-10:#5C5854;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans JP','Inter',sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #F5EFDD 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, #F0E8D2 0%, transparent 50%),
    var(--paper);
  color:var(--ink);
  line-height:1.7;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  /* iOS standalone safe area */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  overscroll-behavior-y:contain;
}
/* Prevent iOS zoom on focus by ensuring input font-size >= 16px */
input,textarea,select{font-size:16px}
button{-webkit-appearance:none;cursor:pointer;font-family:inherit}

/* ============================================================
   Page frame: ノートのインデックスタブ感
   ============================================================ */
.app{
  max-width:980px;
  margin:0 auto;
  padding:24px 16px 80px;
}

header.brand{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:8px;
}
header.brand h1{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:.04em;
}
header.brand h1 .sep{
  color:var(--accent);
  margin:0 .35em;
}
header.brand .sub{
  font-family:'Crimson Pro',serif;
  font-size:14px;
  color:var(--ink-soft);
  font-style:italic;
  text-align:right;
}

/* ============================================================
   Lesson tab strip (left index tabs like a notebook)
   ============================================================ */
.tab-strip{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin:18px 0 0;
  padding-bottom:0;
}
.tab-strip button.lesson-tab{
  appearance:none;
  border:none;
  background:#EAE2CE;
  color:var(--ink-soft);
  font-family:'Inter','Noto Sans JP',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:10px 14px 12px;
  border-radius:10px 10px 0 0;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:transform .15s ease, background .15s;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  min-width:96px;
}
.tab-strip button.lesson-tab .ttl{
  font-size:11px;
  color:var(--ink-soft);
  font-weight:500;
  font-family:'Noto Sans JP',sans-serif;
}
.tab-strip button.lesson-tab .num{font-size:13px;color:var(--ink)}
.tab-strip button.lesson-tab:hover{background:#F0E8D2;transform:translateY(-2px)}
.tab-strip button.lesson-tab.active{
  background:var(--paper);
  color:var(--ink);
  border-bottom:3px solid var(--paper);
  box-shadow:0 -4px 12px rgba(60,40,20,.08);
  transform:translateY(0);
}
.tab-strip button.lesson-tab.active::after{
  content:"";
  position:absolute;
  left:0;right:0;top:0;
  height:4px;
  border-radius:10px 10px 0 0;
  background:var(--tab-color, var(--accent));
}

/* notebook sheet */
.sheet{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:0 12px 12px 12px;
  padding:32px 32px 40px;
  box-shadow:var(--shadow);
  position:relative;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      var(--rule-soft) 31px,
      var(--rule-soft) 32px
    );
}
.sheet::before{
  content:"";
  position:absolute;
  left:54px;top:0;bottom:0;
  width:1px;
  background:rgba(232,116,60,.25);
}

/* Lesson header */
.lesson-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding-bottom:18px;
  margin-bottom:18px;
  border-bottom:1px dashed var(--rule);
}
.lesson-head .titles h2{
  font-family:'Crimson Pro',serif;
  font-size:30px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:.01em;
  line-height:1.2;
}
.lesson-head .titles h2 .lesson-num{
  display:inline-block;
  background:var(--tab-color, var(--accent));
  color:#fff;
  padding:2px 12px;
  border-radius:6px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  letter-spacing:.08em;
  margin-right:10px;
  vertical-align:middle;
  transform:translateY(-3px);
}
.lesson-head .titles .theme{
  font-size:13px;
  color:var(--ink-soft);
  margin-top:4px;
}
.lesson-head .titles .theme b{color:var(--accent-deep);font-weight:600}
.lesson-head .progress-card{
  background:#FFF;
  border:1px solid var(--rule);
  border-radius:10px;
  padding:10px 14px;
  min-width:170px;
  text-align:right;
}
.lesson-head .progress-card .label{font-size:11px;color:var(--ink-soft);letter-spacing:.05em}
.lesson-head .progress-card .pct{
  font-family:'Crimson Pro',serif;
  font-size:24px;
  font-weight:600;
  color:var(--indigo);
}
.lesson-head .progress-card .bar{
  height:6px;background:#EFE9D9;border-radius:99px;overflow:hidden;margin-top:6px;
}
.lesson-head .progress-card .bar > i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--tab-color,var(--accent)),var(--accent-deep));
  border-radius:99px;
  transition:width .5s ease;
}

/* Mode picker */
.mode-row{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:0 0 18px;
  border-bottom:1px solid var(--rule);
  margin-bottom:22px;
}
.mode-row button{
  appearance:none;
  border:1.5px solid var(--rule);
  background:#FFFDF7;
  color:var(--ink);
  font-family:'Noto Sans JP',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:8px 14px;
  border-radius:99px;
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;align-items:center;gap:6px;
}
.mode-row button .glyph{font-size:14px}
.mode-row button:hover{border-color:var(--accent);color:var(--accent-deep);background:#FFF7EF}
.mode-row button.active{
  background:var(--ink);color:#FFFDF7;border-color:var(--ink);
}

/* ============================================================
   Question card
   ============================================================ */
.qarea{padding:6px 4px}
.qmeta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--ink-soft);
  margin-bottom:10px;
}
.qmeta .step{font-family:'Crimson Pro',serif;font-size:14px}
.qmeta .score{font-weight:600}
.qmeta .score b.good{color:var(--good)}
.qmeta .score b.bad{color:var(--bad)}

.q-card{
  background:#FFFDF7;
  border:1px solid var(--rule);
  border-radius:14px;
  padding:24px 26px;
  margin-bottom:18px;
  position:relative;
  box-shadow:0 2px 6px rgba(60,40,20,.04);
}
.q-card .qno{
  position:absolute;left:-10px;top:18px;
  background:var(--tab-color,var(--accent));
  color:#fff;
  font-family:'Crimson Pro',serif;font-weight:600;
  padding:2px 10px;border-radius:4px;font-size:13px;
}
.q-card .qprompt{
  font-size:13px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.04em;
}
.q-card .qbody{
  font-family:'Crimson Pro',serif;
  font-size:20px;
  line-height:1.7;
  margin:6px 0 18px;
  color:var(--ink);
}
.q-card .qbody .blank{
  display:inline-block;min-width:80px;text-align:center;
  border-bottom:2px solid var(--accent);
  font-weight:600;color:transparent;
}
.q-card .qbody.ja{font-family:'Noto Sans JP',sans-serif;font-size:18px}
.q-card .reading-passage{
  font-family:'Crimson Pro',serif;
  font-size:17px;line-height:1.85;
  color:var(--ink);
  background:#FFF9EC;
  border-left:3px solid var(--accent);
  padding:18px 22px;
  border-radius:0 8px 8px 0;
  margin-bottom:18px;
  max-height:none;
}
.q-card .reading-passage h4{
  font-size:14px;font-family:'Inter',sans-serif;color:var(--accent-deep);
  margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase;
}

/* choices */
.choices{display:flex;flex-direction:column;gap:8px}
.choices button.choice{
  appearance:none;
  text-align:left;
  background:#FFF;
  border:1.5px solid var(--rule);
  padding:12px 16px;
  border-radius:10px;
  font-family:'Crimson Pro',serif;
  font-size:17px;
  cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;
  transition:all .15s;
  color:var(--ink);
}
.choices button.choice .mark{
  display:inline-block;
  width:24px;height:24px;
  border-radius:50%;
  background:#EFE9D9;
  color:var(--ink-soft);
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.choices button.choice:hover:not(.locked){
  border-color:var(--accent);
  background:#FFF7EF;
}
.choices button.choice.selected{border-color:var(--indigo)}
.choices button.choice.correct{
  background:#EAF6EE;border-color:var(--good);color:#1F5C32;
}
.choices button.choice.correct .mark{background:var(--good);color:#fff}
.choices button.choice.wrong{
  background:#FBEBE6;border-color:var(--bad);color:#7A2A1A;
}
.choices button.choice.wrong .mark{background:var(--bad);color:#fff}
.choices button.choice.locked{cursor:default}

/* Free text input (writing / translate) */
textarea.answer-input{
  width:100%;
  min-height:88px;
  background:#FFFDF7;
  border:1.5px solid var(--rule);
  border-radius:10px;
  padding:14px 16px;
  font-family:'Crimson Pro',serif;
  font-size:17px;
  color:var(--ink);
  resize:vertical;
  line-height:1.6;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 27px,
    var(--rule-soft) 27px, var(--rule-soft) 28px);
}
textarea.answer-input.ja{
  font-family:'Noto Sans JP','Zen Maru Gothic',sans-serif;
  font-size:16px;
}
textarea.answer-input:focus{outline:none;border-color:var(--accent);background-color:#FFF}

/* Single-line verb form fill */
.text-fill-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:8px;
}
.text-fill-row label{
  font-size:13px;color:var(--ink-soft);
}
input.text-fill{
  flex:1;min-width:160px;
  border:none;
  border-bottom:2px solid var(--accent);
  background:#FFFDF7;
  font-family:'Crimson Pro',serif;
  font-size:18px;
  font-weight:600;
  color:var(--ink);
  padding:8px 4px;
  font-style:italic;
}
input.text-fill:focus{outline:none;background:#FFF7EF}

/* Arrange (並べ替え) chip area */
.arrange-area{margin-top:6px}
.arrange-answer{
  min-height:64px;
  border:1.5px dashed var(--rule);
  border-radius:10px;
  padding:14px 12px;
  background:#FFFDF7;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:14px;
  align-items:flex-start;
}
.arrange-answer .placeholder{
  color:var(--ink-soft);font-size:13px;font-style:italic;
  display:flex;align-items:center;height:32px;
}
.arrange-pool{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:8px 0;
  border-top:1px dashed var(--rule);
}
.arrange-pool::before{
  content:"語の引き出し";
  display:block;width:100%;font-size:11px;color:var(--ink-soft);
  margin-bottom:6px;letter-spacing:.05em;
}
.word-chip{
  background:#FFF;
  border:1.5px solid var(--rule);
  padding:6px 14px;
  border-radius:99px;
  font-family:'Crimson Pro',serif;
  font-size:17px;
  cursor:pointer;
  transition:all .12s;
  color:var(--ink);
}
.word-chip:hover:not(:disabled){
  border-color:var(--accent);
  background:#FFF7EF;
}
.arrange-answer .word-chip{
  background:var(--ink);
  color:#FFFDF7;
  border-color:var(--ink);
}
.arrange-answer .word-chip:hover{
  background:#000;border-color:#000;
}
.word-chip:disabled{opacity:.4;cursor:not-allowed}

/* Action buttons */
.q-actions{
  display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center;
}
.btn{
  appearance:none;border:none;cursor:pointer;
  padding:10px 22px;border-radius:99px;
  font-family:'Noto Sans JP',sans-serif;font-weight:600;font-size:14px;
  transition:transform .12s, background .12s;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:#FFFDF7}
.btn.primary:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-deep)}

/* Feedback panel (shown after answer) */
.feedback{
  margin-top:14px;padding:14px 18px;
  border-radius:10px;
  font-size:14px;line-height:1.7;
  display:none;
  animation:popIn .25s ease;
}
.feedback.show{display:block}
.feedback.good{background:#EAF6EE;border-left:3px solid var(--good);color:#1F5C32}
.feedback.bad{background:#FBEBE6;border-left:3px solid var(--bad);color:#7A2A1A}
.feedback .stamp{
  display:inline-block;font-weight:700;letter-spacing:.1em;
  margin-right:8px;font-family:'Crimson Pro',serif;font-size:16px;
}
.feedback .ja-hint{
  display:block;margin-top:6px;color:var(--ink-soft);font-size:13px;
}
.feedback .ans-line{
  display:block;margin-top:6px;color:var(--ink);font-size:14px;
}
.feedback .ans-line b{color:var(--good)}

@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

/* Summary screen */
.summary{
  background:#FFFDF7;
  border:1px solid var(--rule);
  border-radius:14px;
  padding:30px;
  text-align:center;
}
.summary h3{
  font-family:'Crimson Pro',serif;font-size:24px;margin-bottom:8px;color:var(--ink);
}
.summary .score-big{
  font-family:'Crimson Pro',serif;font-size:64px;font-weight:600;
  color:var(--accent);line-height:1;margin:10px 0;
}
.summary .score-big small{font-size:24px;color:var(--ink-soft)}
.summary .stamp-circle{
  display:inline-block;border:3px double var(--accent);border-radius:50%;
  padding:14px 22px;color:var(--accent-deep);
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
  transform:rotate(-8deg);margin:14px 0;
  font-size:18px;letter-spacing:.1em;
}
.summary .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* Placeholder for未実装lessons */
.placeholder{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
}
.placeholder .glyph{font-size:48px;display:block;margin-bottom:12px;opacity:.5}
.placeholder h3{font-family:'Crimson Pro',serif;font-size:22px;margin-bottom:6px;color:var(--ink)}
.placeholder p{font-size:14px}
.placeholder .badge{
  display:inline-block;margin-top:18px;
  background:#EFE9D9;color:var(--ink-soft);
  padding:6px 14px;border-radius:99px;font-size:12px;
}

/* Review bank (復習帳) drawer button */
.review-fab{
  position:fixed;
  right:20px;bottom:20px;
  background:var(--indigo);color:#fff;
  border:none;border-radius:99px;
  padding:12px 18px;
  font-family:'Noto Sans JP',sans-serif;font-weight:600;font-size:13px;
  cursor:pointer;
  box-shadow:var(--shadow-deep);
  display:inline-flex;align-items:center;gap:6px;
  z-index:50;
}
.review-fab .count{
  background:var(--accent);padding:2px 8px;border-radius:99px;font-size:11px;
}
.review-fab:hover{background:var(--indigo-soft)}

.modal-bg{
  position:fixed;inset:0;background:rgba(20,15,5,.45);
  display:none;align-items:flex-start;justify-content:center;
  z-index:100;padding:40px 16px;overflow-y:auto;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--paper);border-radius:14px;
  width:100%;max-width:680px;padding:24px 26px;
  box-shadow:var(--shadow-deep);
}
.modal h3{
  font-family:'Crimson Pro',serif;font-size:22px;margin-bottom:6px;
}
.modal .close{
  float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);
}
.modal .item{
  border-top:1px dashed var(--rule);padding:14px 0;
}
.modal .item:first-of-type{border-top:none}
.modal .item .q{font-family:'Crimson Pro',serif;font-size:16px;color:var(--ink)}
.modal .item .a{font-size:13px;color:var(--ink-soft);margin-top:4px}
.modal .item .a b{color:var(--good)}
.modal .item .tags{font-size:11px;color:var(--ink-soft);margin-top:4px}

/* Footer */
footer.colophon{
  text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px;
  font-family:'Crimson Pro',serif;letter-spacing:.05em;
}

/* Mobile */
@media (max-width:680px){
  .app{padding:16px 8px 80px}
  .sheet{padding:22px 18px 30px}
  .sheet::before{display:none}
  .lesson-head{flex-direction:column}
  .lesson-head .progress-card{align-self:stretch;text-align:left}
  .tab-strip button.lesson-tab{min-width:70px;padding:8px 10px}
  .tab-strip button.lesson-tab .ttl{display:none}
  .q-card .qbody{font-size:17px}
}

/* Print */
@media print{
  body{background:#fff}
  .tab-strip,.review-fab,.mode-row,.q-actions,.lesson-head .progress-card{display:none}
  .sheet{box-shadow:none;border:none;background-image:none}
}
</style>
</head>
<body>

<div class="app">

  <header class="brand">
    <h1>学習帖<span class="sep">—</span>英語</h1>
    <div class="sub">Power On English&nbsp;Communication&nbsp;Ⅰ&nbsp;|&nbsp;Lesson Trainer</div>
  </header>

  <!-- Lesson tabs -->
  <nav class="tab-strip" id="lessonTabs"></nav>

  <!-- Main sheet -->
  <main class="sheet" id="sheet"></main>

  <footer class="colophon">
    学習帖 — 試験対策ノート &nbsp;·&nbsp; 教科書の本文・設問は引用しません。出題はオリジナル類題です。
  </footer>
</div>

<!-- Review FAB -->
<button class="review-fab" id="reviewFab" title="間違えた問題">
  <span>☆ 復習帳</span>
  <span class="count" id="reviewCount">0</span>
</button>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ============================================================
   Lesson metadata
   ============================================================ */

/* ============================================================
   State & persistence
   ============================================================ */
const STORE_KEY = "gakushucho_eigo_v1";
const State = {
  lesson:1,
  mode:"vocab",
  q:0,
  score:{good:0,bad:0},
  showFeedback:false,
  selected:null,
  freeText:"",
  done:false,
  progress:{},        // {1:{vocab:.., grammar:.., ...}, ...}
  review:[],          // wrong-answer bank
  pool:null,          // current question pool (cached)
};

function saveStore(){
  const data={progress:State.progress, review:State.review};
  try{localStorage.setItem(STORE_KEY, JSON.stringify(data));}catch(e){}
}
function loadStore(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const d=JSON.parse(raw);
    State.progress=d.progress||{};
    State.review=d.review||[];
  }catch(e){}
}

function getPool(lesson, mode){
  const data=QUESTIONS[lesson];
  if(!data) return [];
  if(mode==="reading"){
    const r=data.reading?.[0];
    if(!r) return [];
    return r.questions.map(q=>({...q, _passage:r}));
  }
  return data[mode]||[];
}

/* ============================================================
   Rendering
   ============================================================ */
const sheet = document.getElementById("sheet");
const tabStrip = document.getElementById("lessonTabs");

function renderTabs(){
  tabStrip.innerHTML="";
  LESSONS.forEach(L=>{
    const b=document.createElement("button");
    b.className="lesson-tab"+(State.lesson===L.n?" active":"");
    b.style.setProperty("--tab-color", `var(${L.color})`);
    b.dataset.n=L.n;
    b.innerHTML=`<span class="num">Lesson ${L.n}</span><span class="ttl">${L.title}</span>`;
    b.onclick=()=>{
      State.lesson=L.n; State.mode="vocab"; resetQuiz(); render();
    };
    tabStrip.appendChild(b);
  });
}

function getLessonProgress(lessonN){
  const p=State.progress[lessonN];
  if(!p) return 0;
  const vals=Object.values(p);
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function render(){
  renderTabs();
  const L=LESSONS.find(l=>l.n===State.lesson);
  const pool=getPool(State.lesson, State.mode);
  const has = pool && pool.length;

  let html=`
  <div class="lesson-head">
    <div class="titles">
      <h2><span class="lesson-num" style="background:var(${L.color})">LESSON ${L.n}</span>${L.title}</h2>
      <div class="theme">テーマ: <b>${L.theme}</b> ／ 文法: <b>${L.grammar}</b></div>
    </div>
    <div class="progress-card">
      <div class="label">LESSON PROGRESS</div>
      <div class="pct">${getLessonProgress(L.n)}%</div>
      <div class="bar"><i style="--tab-color:var(${L.color});width:${getLessonProgress(L.n)}%"></i></div>
    </div>
  </div>
  <div class="mode-row">
    ${MODES.map(m=>`<button data-mode="${m.id}" class="${m.id===State.mode?'active':''}"><span class="glyph">${m.glyph}</span>${m.label}</button>`).join("")}
  </div>
  <div class="qarea" id="qarea"></div>`;
  sheet.innerHTML=html;
  // set tab color CSS var on sheet for accents
  sheet.style.setProperty("--tab-color", `var(${L.color})`);

  sheet.querySelectorAll(".mode-row button").forEach(b=>{
    b.onclick=()=>{ State.mode=b.dataset.mode; resetQuiz(); render(); };
  });

  if(!has){
    renderPlaceholder();
  }else{
    renderQuiz();
  }
  updateReviewFab();
}

function renderPlaceholder(){
  document.getElementById("qarea").innerHTML=`
  <div class="placeholder">
    <span class="glyph">📓</span>
    <h3>このセクションは準備中です</h3>
    <p>Lesson ${State.lesson} の「${MODES.find(m=>m.id===State.mode).label}」は近日リリース予定です。</p>
    <span class="badge">Lesson 1 と Lesson 2 でひととおりお試しできます</span>
  </div>`;
}

function resetQuiz(){
  State.q=0; State.score={good:0,bad:0};
  State.showFeedback=false; State.selected=null; State.freeText="";
  State.done=false; State.pool=null;
}

function renderQuiz(){
  if(!State.pool){
    const p=getPool(State.lesson, State.mode);
    // shallow shuffle for variety on each session
    State.pool=[...p].sort(()=>Math.random()-0.5);
  }
  const total=State.pool.length;
  if(State.done){ renderSummary(); return; }
  const q=State.pool[State.q];
  if(!q){ State.done=true; renderSummary(); return; }

  const area=document.getElementById("qarea");
  const isReading = State.mode==="reading";
  // Determine effective type for this question (test mode uses q.type, others use mode)
  const effType = q.type || State.mode;
  const isWriting   = effType==="writing";
  const isTranslate = effType==="translate";
  const isVerbForm  = effType==="verbform";
  const isArrange   = effType==="arrange";
  const isFreeInput = isWriting || isTranslate || isVerbForm;

  let qbodyClass="qbody";
  if(/^[ぁ-んァ-ヶ一-龯、。「」]/.test((q.body||"")[0]||"")) qbodyClass+=" ja";

  // Body for arrange = the Japanese sentence to translate
  let bodyHtml = formatBody(q.body);
  if(isArrange){
    // ensure JA styling
    qbodyClass = "qbody ja";
  }

  let inputHtml = "";
  if(isArrange)        inputHtml = renderArrange(q);
  else if(isVerbForm)  inputHtml = renderVerbForm(q);
  else if(isFreeInput) inputHtml = renderWriting(q, isTranslate);
  else                 inputHtml = renderChoices(q);

  let html=`
  <div class="qmeta">
    <div class="step">問 ${State.q+1} <span style="opacity:.5"> / ${total}</span></div>
    <div class="score">○ <b class="good">${State.score.good}</b> &nbsp; × <b class="bad">${State.score.bad}</b></div>
  </div>
  ${isReading?`
    <div class="q-card">
      <div class="reading-passage">
        <h4>READING PASSAGE</h4>
        ${escapeHtml(q._passage.passage).replace(/\n\n/g,'</p><p style="margin-top:10px">').replace(/^/,'<p>')}</p>
        <p style="text-align:right;margin-top:8px;font-style:italic;color:var(--ink-soft);font-size:13px">— ${escapeHtml(q._passage.title)}</p>
      </div>
    </div>`:""}
  <div class="q-card">
    <span class="qno">Q${State.q+1}</span>
    <div class="qprompt">${escapeHtml(q.prompt||"")}</div>
    <div class="${qbodyClass}">${bodyHtml}</div>
    ${inputHtml}
    <div class="feedback" id="fb"></div>
    <div class="q-actions">
      <button class="btn primary" id="checkBtn" ${isFreeInput||isArrange?"":"disabled"}>採点する</button>
      <button class="btn ghost" id="nextBtn" style="display:none">次の問題 →</button>
      <button class="btn ghost" id="skipBtn">スキップ</button>
    </div>
  </div>`;
  area.innerHTML=html;

  // wire actions per type
  if(isArrange){
    setupArrange();
    document.getElementById("checkBtn").onclick=()=>checkArrange(q);
  }else if(isVerbForm){
    const inp=area.querySelector("input.text-fill");
    inp.addEventListener("input", e=>{ State.freeText=e.target.value; });
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); checkVerbForm(q); }});
    document.getElementById("checkBtn").onclick=()=>checkVerbForm(q);
  }else if(isFreeInput){
    const ta=area.querySelector("textarea.answer-input");
    ta.addEventListener("input", e=>{ State.freeText=e.target.value; });
    document.getElementById("checkBtn").onclick=()=>checkWriting(q, isTranslate);
  }else{
    area.querySelectorAll(".choice").forEach(btn=>{
      btn.onclick=()=>{
        if(State.showFeedback) return;
        State.selected=Number(btn.dataset.i);
        area.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        document.getElementById("checkBtn").disabled=false;
      };
    });
    document.getElementById("checkBtn").onclick=()=>checkChoice(q);
  }
  document.getElementById("nextBtn").onclick=nextQuestion;
  document.getElementById("skipBtn").onclick=()=>{ nextQuestion(true); };
}

function renderChoices(q){
  return `<div class="choices">${q.choices.map((c,i)=>
    `<button class="choice" data-i="${i}">
       <span class="mark">${"ABCD"[i]}</span>
       <span>${escapeHtml(c)}</span>
     </button>`).join("")}</div>`;
}

function renderWriting(q, ja=false){
  const cls = "answer-input" + (ja?" ja":"");
  const ph  = ja ? "ここに日本語で和訳を入力" : "ここに英語で解答を入力";
  return `<textarea class="${cls}" placeholder="${ph}" autofocus>${escapeHtml(State.freeText||"")}</textarea>`;
}

function renderVerbForm(q){
  return `<div class="text-fill-row">
    <label>カッコ内の語を適切な形に →</label>
    <input type="text" class="text-fill" placeholder="例: is cleaning" value="${escapeHtml(State.freeText||"")}" autofocus>
  </div>`;
}

function renderArrange(q){
  // Shuffle the words once and cache on the question (so user sees the same shuffle within this question)
  if(!q._shuffle){
    const arr = [...q.scramble];
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    q._shuffle = arr;
  }
  const pool = q._shuffle;
  return `<div class="arrange-area">
    <div class="arrange-answer" id="arrAns">
      <span class="placeholder">↓ 下から順にタップして英文を組み立てよう</span>
    </div>
    <div class="arrange-pool" id="arrPool">
      ${pool.map((w,i)=>`<button class="word-chip" data-w="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join("")}
    </div>
  </div>`;
}

function setupArrange(){
  const pool = document.getElementById("arrPool");
  const ans  = document.getElementById("arrAns");
  function refreshPlaceholder(){
    if(!ans.querySelector(".word-chip")){
      if(!ans.querySelector(".placeholder")){
        const ph=document.createElement("span");
        ph.className="placeholder";
        ph.textContent="↓ 下から順にタップして英文を組み立てよう";
        ans.appendChild(ph);
      }
    } else {
      ans.querySelector(".placeholder")?.remove();
    }
  }
  document.querySelectorAll(".arrange-area .word-chip").forEach(btn=>{
    btn.onclick = () => {
      if(State.showFeedback) return;
      if(btn.parentElement === pool){
        ans.querySelector(".placeholder")?.remove();
        ans.appendChild(btn);
      } else {
        pool.appendChild(btn);
        refreshPlaceholder();
      }
    };
  });
}

function normalizeArrangeWord(w){
  return String(w||"").toLowerCase()
    .replace(/[.,!?;:"']/g,"")
    .trim();
}
function checkArrange(q){
  const ans=document.getElementById("arrAns");
  const userWords = [...ans.querySelectorAll(".word-chip")].map(c=>c.dataset.w);
  if(userWords.length === 0){
    alert("並べてから採点してください。");
    return;
  }
  const expected = q.answer.split(/\s+/);
  const a = userWords.map(normalizeArrangeWord).join(" ");
  const b = expected.map(normalizeArrangeWord).join(" ");
  let ok = (a===b);
  if(!ok && q.alts){
    for(const alt of q.alts){
      const c = alt.split(/\s+/).map(normalizeArrangeWord).join(" ");
      if(a===c){ ok=true; break; }
    }
  }
  State.showFeedback=true;
  // lock chips
  document.querySelectorAll(".arrange-area .word-chip").forEach(c=>c.disabled=true);
  showFeedback(ok, q, true, userWords.join(" "));
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
}

function checkVerbForm(q){
  const ans=(State.freeText||"").trim();
  if(!ans){ alert("解答を入力してください。"); return; }
  State.showFeedback=true;
  const ok = isWritingCorrect(ans, q);
  showFeedback(ok, q, true, ans);
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
  document.querySelector("input.text-fill").disabled=true;
}

function checkChoice(q){
  if(State.selected==null) return;
  State.showFeedback=true;
  const area=document.getElementById("qarea");
  area.querySelectorAll(".choice").forEach((b,i)=>{
    b.classList.add("locked");
    if(i===q.answer) b.classList.add("correct");
    if(i===State.selected && i!==q.answer) b.classList.add("wrong");
  });
  const ok=(State.selected===q.answer);
  showFeedback(ok, q);
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
}

function checkWriting(q, ja=false){
  const ans=(State.freeText||"").trim();
  if(!ans){ alert("解答を入力してください。"); return; }
  State.showFeedback=true;
  const ok = ja ? isJaCorrect(ans, q) : isWritingCorrect(ans, q);
  showFeedback(ok, q, true, ans);
  if(ok) State.score.good++; else { State.score.bad++; addToReview(q); }
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
  document.querySelector("textarea.answer-input").disabled=true;
}

function normalize(s){
  return s.toLowerCase()
    .replace(/[’‘`´]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function isWritingCorrect(input, q){
  const cand=[q.answer, ...(q.alts||[])].map(normalize);
  const n=normalize(input);
  return cand.includes(n);
}
function normalizeJa(s){
  return String(s||"")
    .replace(/[、。．，！？「」『』 　\s　]/g,"")
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60)) // katakana→hiragana
    .toLowerCase();
}
function isJaCorrect(input, q){
  const cand=[q.answer, ...(q.alts||[])].map(normalizeJa);
  const n=normalizeJa(input);
  // exact match or partial - require >= 70% character overlap
  if(cand.includes(n)) return true;
  // permissive: if user's answer contains all expected keywords from any cand
  for(const c of cand){
    if(c.length>0 && n.length>=Math.floor(c.length*0.7)){
      // count shared chars
      const setC=new Set(c);
      let shared=0;
      for(const ch of n){ if(setC.has(ch)) shared++; }
      if(shared >= Math.floor(c.length*0.7)) return true;
    }
  }
  return false;
}

function showFeedback(ok, q, writingMode=false, userInput=""){
  const fb=document.getElementById("fb");
  fb.classList.add("show");
  fb.classList.remove("good","bad");
  fb.classList.add(ok?"good":"bad");
  let html="";
  if(ok){
    html += `<span class="stamp">◎ 正解！</span>${escapeHtml(q.note||"よく出来ました。")}`;
  }else{
    html += `<span class="stamp">× 不正解</span>もう一度確認しましょう。`;
    if(!writingMode){
      html += `<span class="ans-line">正解: <b>${"ABCD"[q.answer]}. ${escapeHtml(q.choices[q.answer])}</b></span>`;
    }else{
      html += `<span class="ans-line">模範解答: <b>${escapeHtml(q.answer)}</b></span>`;
      if(q.alts && q.alts.length){
        html += `<span class="ja-hint">他の許容例: ${q.alts.map(a=>`「${escapeHtml(a)}」`).join(" / ")}</span>`;
      }
      html += `<span class="ja-hint">あなたの解答: ${escapeHtml(userInput)}</span>`;
    }
    if(q.note) html += `<span class="ja-hint">ヒント: ${escapeHtml(q.note)}</span>`;
  }
  fb.innerHTML=html;
}

function nextQuestion(skip=false){
  if(skip && !State.showFeedback){
    State.score.bad++; addToReview(State.pool[State.q]);
  }
  State.q++;
  State.showFeedback=false;
  State.selected=null;
  State.freeText="";
  if(State.q>=State.pool.length){ State.done=true; commitProgress(); renderSummary(); return; }
  renderQuiz();
}

function addToReview(q){
  // dedupe by body
  if(!State.review.find(r=>r.body===q.body && r.lesson===State.lesson && r.mode===State.mode)){
    State.review.push({
      lesson:State.lesson, mode:State.mode,
      body:q.body, prompt:q.prompt,
      answer:q.choices? q.choices[q.answer] : q.answer,
      note:q.note||""
    });
    saveStore();
  }
}

function commitProgress(){
  const total=State.score.good+State.score.bad;
  const pct = total? Math.round(100*State.score.good/total):0;
  State.progress[State.lesson] = State.progress[State.lesson] || {};
  State.progress[State.lesson][State.mode] = pct;
  saveStore();
}

function renderSummary(){
  const area=document.getElementById("qarea");
  const total=State.score.good+State.score.bad;
  const pct = total? Math.round(100*State.score.good/total):0;
  let stamp="もう一度復習しましょう。";
  if(pct>=90) stamp="満点近し！素晴らしい";
  else if(pct>=70) stamp="よくできました";
  else if(pct>=50) stamp="あと一歩";
  area.innerHTML=`
  <div class="summary">
    <h3>${MODES.find(m=>m.id===State.mode).label} ・ 結果</h3>
    <div class="score-big">${pct}<small>%</small></div>
    <div>${State.score.good} / ${total} 問正解</div>
    <div class="stamp-circle">${stamp}</div>
    <div class="row">
      <button class="btn primary" id="againBtn">もう一度</button>
      <button class="btn accent" id="nextModeBtn">次のモードへ</button>
      <button class="btn ghost" id="goReviewBtn">復習帳を見る</button>
    </div>
  </div>`;
  document.getElementById("againBtn").onclick=()=>{ resetQuiz(); render(); };
  document.getElementById("nextModeBtn").onclick=()=>{
    const idx=MODES.findIndex(m=>m.id===State.mode);
    State.mode=MODES[(idx+1)%MODES.length].id;
    resetQuiz(); render();
  };
  document.getElementById("goReviewBtn").onclick=openReview;
  updateReviewFab();
}

/* ============================================================
   Review (復習帳) modal
   ============================================================ */
const modalBg=document.getElementById("modalBg");
const modalBody=document.getElementById("modalBody");

function openReview(){
  let html=`
    <button class="close" id="closeModal">×</button>
    <h3>☆ 復習帳</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:8px">間違えた問題が自動で集まります。</p>`;
  if(!State.review.length){
    html += `<p style="margin-top:18px;color:var(--ink-soft)">まだ登録された問題はありません。問題を解くと、間違えたものがここに集まります。</p>`;
  }else{
    html += State.review.map((r,i)=>{
      const L=LESSONS.find(l=>l.n===r.lesson);
      return `<div class="item">
        <div class="q">${escapeHtml(r.body)}</div>
        <div class="a">正解: <b>${escapeHtml(r.answer)}</b></div>
        ${r.note?`<div class="a" style="color:var(--ink-soft)">ヒント: ${escapeHtml(r.note)}</div>`:""}
        <div class="tags">Lesson ${L.n} ${L.title} / ${MODES.find(m=>m.id===r.mode)?.label||r.mode}</div>
      </div>`;
    }).join("");
    html += `<div style="margin-top:18px;text-align:right">
      <button class="btn ghost" id="clearReviewBtn">復習帳を空にする</button>
    </div>`;
  }
  modalBody.innerHTML=html;
  modalBg.classList.add("show");
  document.getElementById("closeModal").onclick=closeReview;
  const cl=document.getElementById("clearReviewBtn");
  if(cl) cl.onclick=()=>{ if(confirm("復習帳をすべて削除しますか？")){ State.review=[]; saveStore(); openReview(); updateReviewFab(); }};
}
function closeReview(){ modalBg.classList.remove("show"); }
modalBg.addEventListener("click", e=>{ if(e.target===modalBg) closeReview(); });

function updateReviewFab(){
  document.getElementById("reviewCount").textContent=State.review.length;
}
document.getElementById("reviewFab").onclick=openReview;

/* ============================================================
   Helpers
   ============================================================ */
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g, c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));}
function formatBody(s){
  // turn (___) into a styled blank
  return escapeHtml(s||"").replace(/\(\s*_+\s*\)/g, '<span class="blank">　　　</span>');
}

/* ============================================================
   Boot
   ============================================================ */
loadStore();
render();

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
