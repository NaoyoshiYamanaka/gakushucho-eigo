<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EFE6CC"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8743C"/>
      <stop offset="100%" stop-color="#C45A26"/>
    </linearGradient>
    <linearGradient id="indigoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F4068"/>
      <stop offset="100%" stop-color="#3A5A85"/>
    </linearGradient>
    <filter id="soft" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- full-bleed background (iOS rounds it) -->
  <rect width="1024" height="1024" fill="url(#paper)"/>

  <!-- notebook rules -->
  <g stroke="#D9D3C2" stroke-width="3" opacity=".5">
    <line x1="120" y1="320" x2="904" y2="320"/>
    <line x1="120" y1="430" x2="904" y2="430"/>
    <line x1="120" y1="540" x2="904" y2="540"/>
    <line x1="120" y1="650" x2="904" y2="650"/>
    <line x1="120" y1="760" x2="904" y2="760"/>
    <line x1="120" y1="870" x2="904" y2="870"/>
  </g>

  <!-- orange margin rule -->
  <line x1="190" y1="60" x2="190" y2="964" stroke="#E8743C" stroke-width="4" opacity=".5"/>

  <!-- index tab on left -->
  <path d="M 60 100 L 360 100 L 410 220 L 360 340 L 60 340 Z" fill="url(#ribbon)" filter="url(#soft)"/>
  <text x="100" y="245"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="120" fill="#FFFDF7" letter-spacing="6">EN</text>

  <!-- corner fold -->
  <path d="M 1024 60 L 1024 180 L 904 180 Z" fill="#E8E0C8"/>
  <path d="M 1024 60 L 904 180 L 904 60 Z" fill="#D9D0B4"/>

  <!-- BIG centered title - keep within safe margins ~140..884 = 744px wide -->
  <g filter="url(#soft)">
    <text x="512" y="630" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-weight="700" font-size="220" fill="#2C2C2C">English</text>
  </g>
  <line x1="280" y1="675" x2="744" y2="675" stroke="#E8743C" stroke-width="10" stroke-linecap="round"/>

  <!-- indigo subtitle pill -->
  <rect x="232" y="755" width="560" height="110" rx="55" fill="url(#indigoG)" filter="url(#soft)"/>
  <text x="512" y="828" text-anchor="middle"
        font-family="Georgia, serif" font-style="italic" font-weight="500"
        font-size="54" fill="#FFFDF7" letter-spacing="2">Power On  EC  I</text>

  <!-- tiny stamp -->
  <circle cx="900" cy="900" r="50" fill="none" stroke="#E8743C" stroke-width="6" stroke-dasharray="3,4"/>
  <text x="900" y="918" text-anchor="middle"
        font-family="Georgia, serif" font-weight="700" font-size="40" fill="#C45A26">JP</text>
</svg>